  const dueBadge = (due) => { const c = countdown(due); return `<span class="countdown ${c.cls}" data-due="${due.getTime()}">⏳ ${esc(c.text)}</span>`; };
  const submitBtn = (a) => a.submitUrl
    ? `<a class="btn btn--primary btn--sm" href="${esc(a.submitUrl)}" target="_blank" rel="noopener">과제 제출하기 →</a>`
    : `<button class="btn btn--primary btn--sm" data-submit-week="${weeks.findIndex((w) => w.assignment === a)}">과제 제출하기 →</button>`;

  /* ---------- 주차별 커리큘럼 (펼쳐 보기) ---------- */
  $("#curriculum").innerHTML = head(cu) + `
    <div class="weeks">
      ${list(weeks, (w) => {
        const [sc, sl] = statusOf(w), a = w.assignment;
        return `
        <article class="card week reveal" id="week-${w.i + 1}">
          <button class="week__head" aria-expanded="false" aria-controls="week-panel-${w.i + 1}">
            <span class="week__tag">${esc(w.tag)}</span>
            <span class="week__title">
              <small>${fmtDay(w.date)} · ${esc(w.theme)}</small>
              <strong>${esc(w.title)}</strong>
            </span>
            <span class="week__badges">
              ${a ? `<span class="pill pill--hw">과제</span>` : ""}
              <span class="pill pill--${sc}">${sl}</span>
            </span>
            <span class="week__chev" aria-hidden="true"></span>
          </button>
          <div class="week__panel" id="week-panel-${w.i + 1}" role="region">
            <div class="week__inner"><div class="week__body">
              <p class="week__summary">${esc(w.summary)}</p>
              <div class="week__meta">
                <span>📅 <b>날짜</b> ${fmtDay(w.date)}</span>
                <span>⏰ <b>시간</b> ${esc(w.time)}</span>
                <span>📍 <b>장소</b> ${esc(w.location)}</span>
              </div>
              <div class="week__grid">
                <div>
                  <h4>학습 내용</h4>
                  <ol class="topics">${list(w.topics, (t) => `<li>${esc(t)}</li>`)}</ol>
                </div>
                <div>
                  <h4>참고 영상</h4>
                  ${w.videos && w.videos.length
                    ? `<ul class="videos">${list(w.videos, (v) => `<li><a href="${esc(v.url)}" target="_blank" rel="noopener"><span class="videos__play">▶</span>${esc(v.title)}</a></li>`)}</ul>`
                    : `<p class="muted">등록된 영상이 없습니다.</p>`}
                </div>
              </div>
              ${a ? `
              <div class="assignment">
                <div class="assignment__head">
                  <span class="pill pill--hw">과제</span>
                  <h4>${esc(a.title)}</h4>
                </div>
                <p>${esc(a.description)}</p>
                <div class="assignment__foot">
                  <div class="assignment__due">
                    <span>마감 <b>${fmtDue(w.dueDate)}</b></span>
                    ${dueBadge(w.dueDate)}
                  </div>
                  ${submitBtn(a)}
                </div>
              </div>` : `<p class="muted no-hw">이번 주는 과제가 없습니다.</p>`}
            </div></div>
          </div>
        </article>`;
      })}
    </div>`;

  // 펼치기/접기
  function setOpen(card, open) {
    card.classList.toggle("is-open", open);
    $(".week__head", card).setAttribute("aria-expanded", String(open));
  }
  $$(".week").forEach((card) => $(".week__head", card).addEventListener("click", () => setOpen(card, !card.classList.contains("is-open"))));
  const firstOpen = document.getElementById(`week-${(nextWeek || weeks.at(-1) || { i: 0 }).i + 1}`);
  if (firstOpen) setOpen(firstOpen, true);

  /* ---------- 월간 달력 ---------- */
  const events = {};   // "YYYY-MM-DD" → { week, dues: [] }
  const ev = (k) => (events[k] = events[k] || { week: null, dues: [] });
  weeks.forEach((w) => {
    ev(keyOf(w.date)).week = w;
    if (w.dueDate) ev(keyOf(w.dueDate)).dues.push(w);
  });

  const sc = C.schedule || { eyebrow: "Schedule", title: "수업 달력" };
  $("#schedule").innerHTML = head(sc) + `
    <div class="cal-wrap reveal">
      <div class="card cal">
        <div class="cal__top">
          <button class="cal__nav" data-move="-1" aria-label="이전 달">‹</button>
          <h3 class="cal__title" aria-live="polite"></h3>
          <button class="cal__nav" data-move="1" aria-label="다음 달">›</button>
          <button class="cal__today">오늘</button>
        </div>
        <div class="cal__legend">
          <span><i class="dot dot--class"></i>수업일</span>
          <span><i class="dot dot--due"></i>과제 마감</span>
          <span><i class="dot dot--today"></i>오늘</span>
        </div>
        <div class="cal__dow">${list(DOW, (d) => `<span>${d}</span>`)}</div>
        <div class="cal__grid"></div>
      </div>
      <aside class="card cal-detail" aria-live="polite"></aside>
    </div>`;

  const firstClass = weeks[0]?.date || new Date(), lastClass = weeks.at(-1)?.date || new Date();
  const now0 = new Date();
  const initial = now0 < firstClass ? firstClass : now0 > addDays(lastClass, 1) ? lastClass : now0;
  let viewY = initial.getFullYear(), viewM = initial.getMonth();
  let selected = keyOf(nextWeek ? nextWeek.date : initial);

  function renderCal() {
    $(".cal__title").textContent = `${viewY}년 ${viewM + 1}월`;
    const first = new Date(viewY, viewM, 1), days = new Date(viewY, viewM + 1, 0).getDate();
    let html = "";
    for (let i = 0; i < first.getDay(); i++) html += `<span class="cal__day is-empty"></span>`;
    for (let d = 1; d <= days; d++) {
      const date = new Date(viewY, viewM, d), k = keyOf(date), e = events[k];
      const cls = ["cal__day",
        date.getDay() === 0 ? "is-sun" : date.getDay() === 6 ? "is-sat" : "",
        k === todayKey() ? "is-today" : "", k === selected ? "is-selected" : "",
        e && e.week ? "is-class" : "", e && e.dues.length ? "is-due" : ""].join(" ");
      const label = `${viewM + 1}월 ${d}일${e && e.week ? `, ${e.week.tag} 수업` : ""}${e && e.dues.length ? ", 과제 마감" : ""}`;
      html += `<button class="${cls}" data-key="${k}" aria-label="${label}" aria-pressed="${k === selected}">
        <span class="cal__num">${d}</span>
        ${e && e.week ? `<span class="cal__ev cal__ev--class">${esc(e.week.tag)}</span>` : ""}
        ${e && e.dues.length ? `<span class="cal__ev cal__ev--due">마감${e.dues.length > 1 ? ` ${e.dues.length}` : ""}</span>` : ""}
      </button>`;
    }
    $(".cal__grid").innerHTML = html;
  }

  function renderDetail() {
    const d = parseDay(selected), e = events[selected], box = $(".cal-detail");
    let html = `<span class="cal-detail__date">${d.getFullYear()}년 ${fmtDay(d)}</span>`;
    if (e && e.week) {
      const w = e.week;
      html += `
        <div class="cal-detail__head"><span class="week__tag">${esc(w.tag)}</span><h3>${esc(w.title)}</h3></div>
        <ul class="cal-detail__meta">
          <li>⏰ ${esc(w.time)}</li>
          <li>📍 ${esc(w.location)}</li>
        </ul>
        <h4>학습 내용</h4>
        <ol class="topics">${list(w.topics, (t) => `<li>${esc(t)}</li>`)}</ol>
        <button class="btn btn--ghost btn--sm" data-open-week="${w.i + 1}">${esc(w.tag)} 상세 보기 ↑</button>`;
    }
    if (e && e.dues.length) {
      html += `<div class="cal-detail__dues">${list(e.dues, (w) => `
        <div class="assignment assignment--mini">
          <div class="assignment__head"><span class="pill pill--hw">과제 마감</span><h4>${esc(w.assignment.title)}</h4></div>
          <div class="assignment__due"><span>마감 <b>${pad2(w.dueDate.getHours())}:${pad2(w.dueDate.getMinutes())}</b></span>${dueBadge(w.dueDate)}</div>
          ${submitBtn(w.assignment)}
        </div>`)}</div>`;
    }
    if (!e) {
      const nx = weeks.find((w) => keyOf(w.date) > selected);
      html += `<div class="cal-detail__empty"><span>🌸</span><p>이 날은 수업이 없습니다.</p>
        ${nx ? `<button class="link-btn" data-key-jump="${keyOf(nx.date)}">다음 수업: ${fmtDay(nx.date)} · ${esc(nx.tag)} →</button>` : ""}</div>`;
    }
    box.innerHTML = html;
  }

  function selectKey(k, moveView) {
    selected = k;
    if (moveView) { const d = parseDay(k); viewY = d.getFullYear(); viewM = d.getMonth(); }
    renderCal(); renderDetail();
  }

  $("#schedule").addEventListener("click", (evt) => {
    const day = evt.target.closest(".cal__day[data-key]");
    if (day) return selectKey(day.dataset.key);
    const nav = evt.target.closest(".cal__nav");
    if (nav) { viewM += Number(nav.dataset.move); if (viewM < 0) { viewM = 11; viewY--; } if (viewM > 11) { viewM = 0; viewY++; } return renderCal(); }
    if (evt.target.closest(".cal__today")) return selectKey(todayKey(), true);
    const jump = evt.target.closest("[data-key-jump]");
    if (jump) return selectKey(jump.dataset.keyJump, true);
    const open = evt.target.closest("[data-open-week]");
    if (open) {
      const card = document.getElementById(`week-${open.dataset.openWeek}`);
      setOpen(card, true);
      const y = card.getBoundingClientRect().top + window.scrollY - $(".header").offsetHeight - 16;
      window.scrollTo({ top: y, behavior: reduceMotion ? "auto" : "smooth" });
    }
  });
  renderCal(); renderDetail();

  // 다른 스크립트(participate.js)에서 쓰도록 공유
  window.__SITE = { esc, list, head, $, $$, weeks, keyOf, todayKey, parseDT, fmtDay, fmtDue, pad2, countdown, dueBadge, reduceMotion };

  // 남은 시간 30초마다 갱신
  setInterval(() => $$("[data-due]").forEach((el) => {
    const c = countdown(new Date(Number(el.dataset.due)));
    el.textContent = "⏳ " + c.text;
    el.className = "countdown " + c.cls;
  }), 30000);

  /* ---------- AI 도구 ---------- */
  const t = C.tools;
  $("#tools").innerHTML = head(t) + `
    <div class="grid grid--${(t.items || []).length === 2 ? 2 : 3}">
      ${list(t.items, (x) => `
        <article class="card tool reveal">
          <div class="tool__top"><span class="tool__icon">${esc(x.icon)}</span><span class="tool__use">${esc(x.use)}</span></div>
          <h3>${esc(x.name)}</h3>
          <p>${esc(x.text)}</p>
        </article>`)}
    </div>`;

  /* ---------- 준비물 + 신청 ---------- */
  const e = C.enrollment;
  $("#enrollment").innerHTML = head(e) + `
    <div class="grid grid--4">
      ${list(e.prepare, (p) => `
        <article class="card prep reveal">
          <div class="feature__icon">${esc(p.icon)}</div>
          <h3>${esc(p.title)}</h3>
          <p>${esc(p.text)}</p>
        </article>`)}
    </div>
    <article class="card apply reveal">
      <h3>${esc(e.apply.title)}</h3>
      <ol>${list(e.apply.steps, (s) => `<li>${esc(s)}</li>`)}</ol>
      ${applyBtn}
    </article>`;

  /* ---------- FAQ ---------- */
  const f = C.faq;
  $("#faq").innerHTML = head(f) + `
    <div class="faq-list">
      ${list(f.items, (q) => `
        <details class="card faq-item reveal">
          <summary>${esc(q.q)}</summary>
          <div class="answer">${esc(q.a)}</div>
        </details>`)}
    </div>`;

  /* ---------- 교수자 푸터 ---------- */
  const p = C.instructor;
  $("#instructor").innerHTML = `
    <div class="footer__inner">
      <div class="footer__profile reveal">
        <div class="avatar">
          <span>${esc(p.initials)}</span>
          ${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.name)} 사진" onerror="this.remove()">` : ""}
        </div>
        <div class="footer__bio">
          <span class="eyebrow eyebrow--light">Instructor</span>
          <h3>${esc(p.name)}</h3>
          <p class="position">${esc(p.position)}</p>
          ${p.bio ? `<p>${esc(p.bio)}</p>` : ""}
          <div class="chips">${list(p.interests, (x) => `<span class="chip">${esc(x)}</span>`)}</div>
        </div>
        <ul class="contacts">
          ${list(p.contacts, (c) => `
            <li><span class="contacts__icon">${esc(c.icon)}</span>
              <span><small>${esc(c.label)}</small>${c.link ? `<a href="${esc(c.link)}">${esc(c.value)}</a>` : esc(c.value)}</span></li>`)}
        </ul>
      </div>
      <div class="footer__bottom">
        <p>${esc(C.site.copyright || `© ${new Date().getFullYear()} ${C.site.university}`)}</p>
      </div>
    </div>`;

  /* ================= 동작 ================= */
  const header = $(".header"), nav = $("#nav"), toggle = $(".menu-toggle"), toTop = $(".to-top");

  // 메뉴·버튼 클릭 → 해당 위치로 부드럽게 이동 (고정 헤더 높이 보정)
  document.addEventListener("click", (ev) => {
    const link = ev.target.closest("a[data-scroll]");
    if (!link) return;
    const id = link.getAttribute("href").slice(1);
    const target = document.getElementById(id);
    if (!target) return;
    ev.preventDefault();
    const y = id === "hero" ? 0 : target.getBoundingClientRect().top + window.scrollY - header.offsetHeight - 12;
    window.scrollTo({ top: y, behavior: reduceMotion ? "auto" : "smooth" });
    history.replaceState(null, "", "#" + id);
    closeMenu();
  });

  // 모바일 햄버거 메뉴
  function closeMenu() { nav.classList.remove("is-open"); toggle.setAttribute("aria-expanded", "false"); }
  toggle.addEventListener("click", () => toggle.setAttribute("aria-expanded", String(nav.classList.toggle("is-open"))));
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeMenu(); });

  // 스크롤: 헤더 그림자, 맨 위로 버튼, 현재 메뉴 강조
  const sections = C.nav.map((n) => document.getElementById(n.id)).filter(Boolean);
  function onScroll() {
    const y = window.scrollY;
    header.classList.toggle("is-scrolled", y > 8);
    toTop.classList.toggle("is-visible", y > 500);
    let current = "";
    for (const s of sections) if (s.getBoundingClientRect().top - header.offsetHeight - 120 <= 0) current = s.id;
    if (window.innerHeight + y >= document.documentElement.scrollHeight - 4) current = sections.at(-1)?.id || current;
    $$("a", nav).forEach((l) => l.classList.toggle("is-active", l.getAttribute("href") === "#" + current));
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }));

  // 숫자 카운트 애니메이션
  function countUp(el) {
    const to = Number(el.dataset.to);
    if (reduceMotion) { el.textContent = to; return; }
    const start = performance.now(), dur = 1400;
    (function tick(now) {
      const k = Math.min(1, (now - start) / dur);
      el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(tick);
    })(start);
  }

  // 스크롤 등장 효과 + 카운트 시작
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => entries.forEach((en) => {
      if (!en.isIntersecting) return;
      en.target.classList.add("is-in");
      const c = $(".count", en.target); if (c) countUp(c);
      io.unobserve(en.target);
    }), { threshold: 0.12 });
    $$(".reveal").forEach((el) => io.observe(el));
  } else {
    $$(".reveal").forEach((el) => el.classList.add("is-in"));
    $$(".count").forEach((c) => (c.textContent = c.dataset.to));
  }

  // 장점 슬라이드 (버튼·점·스와이프·키보드)
  const track = $(".slider__track");
  if (track) {
    const slides = $$(".slide", track), dots = $$(".slider__dots button");
    const prev = $(".slider__nav--prev"), next = $(".slider__nav--next");
    const pos = (i) => slides[i].offsetLeft - slides[0].offsetLeft;
    const index = () => {
      let best = 0;
      slides.forEach((_, i) => { if (Math.abs(pos(i) - track.scrollLeft) < Math.abs(pos(best) - track.scrollLeft)) best = i; });
      return best;
    };
    const go = (i) => track.scrollTo({ left: pos(Math.max(0, Math.min(slides.length - 1, i))), behavior: reduceMotion ? "auto" : "smooth" });
    function update() {
      const i = index(), max = track.scrollWidth - track.clientWidth - 2;
      dots.forEach((d, j) => d.classList.toggle("is-active", j === i));
      prev.disabled = track.scrollLeft <= 2;
      next.disabled = track.scrollLeft >= max;
    }
    prev.addEventListener("click", () => go(index() - 1));
    next.addEventListener("click", () => go(index() + 1));
    dots.forEach((d, j) => d.addEventListener("click", () => go(j)));
    track.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowRight") { ev.preventDefault(); go(index() + 1); }
      if (ev.key === "ArrowLeft") { ev.preventDefault(); go(index() - 1); }
    });
    track.addEventListener("scroll", () => requestAnimationFrame(update), { passive: true });
    window.addEventListener("resize", update);
    update();
  }

})();

</script>
<script id="participate-js" data-bundle="1">
/* =====================================================================
 *  participate.js — 수강생 참여 기능
 *  (실시간 투표 · 회원가입 · 로그인/출석/과제 제출 · 안내 팝업 · 환영 폭죽)
 *  내용 수정은 관리자 화면(🔒) 또는 설정 부분에서 하세요. 이 부분은 고칠 필요가 없습니다.
 * ===================================================================== */
(function () {
  "use strict";
  const C = window.SITE_CONFIG, S = window.__SITE;
  if (!C || !S) return;
  const { esc, list, head, $, $$, weeks, keyOf, todayKey, parseDT, fmtDay, fmtDue, pad2, countdown, dueBadge, reduceMotion } = S;
  const REMOTE = !!(C.backend && C.backend.url);

  /* ================= 저장소 (브라우저) ================= */
  const store = {
    get(k, fb) { try { const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); } catch (_) { return fb; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
    sget(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch (_) { return null; } },
    sset(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
  };
  const P = "ab26.";   // 저장 키 접두어

  /* ================= 데이터 처리 (체험 모드 / 운영 모드) ================= */
  const remote = {
    async get(params) {
      const r = await fetch(C.backend.url + "?" + new URLSearchParams(params));
      const j = await r.json(); if (!j.ok) throw new Error(j.error || "요청 실패"); return j;
    },
    async post(body) {
      const r = await fetch(C.backend.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
      const j = await r.json(); if (!j.ok) throw new Error(j.error || "요청 실패"); return j;
    }
  };
  const fileToBase64 = (file) => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(",")[1]);
    fr.onerror = () => rej(new Error("파일을 읽지 못했습니다."));
    fr.readAsDataURL(file);
  });

  const api = REMOTE ? {
    poll: () => remote.get({ action: "poll" }).then((j) => j.counts),
    vote: (option, prev) => remote.post({ action: "vote", option, prev }).then((j) => j.counts),
    apply: (data, account) => remote.post({ action: "apply", data, account }),
    login: (id, pin) => remote.post({ action: "login", id, pin }).then((j) => ({ id, pin, name: j.name })),
    status: (u) => remote.post({ action: "status", id: u.id, pin: u.pin }),
    attend: (u, week, code) => remote.post({ action: "attend", id: u.id, pin: u.pin, week, code }),
    submit: async (u, week, file) => remote.post({
      action: "submit", id: u.id, pin: u.pin, week, due: weeks[week].dueDate ? weeks[week].dueDate.toISOString() : "",
      fileName: file.name, mimeType: file.type || "application/octet-stream", data: await fileToBase64(file)
    })
  } : {
    async poll() { return store.get(P + "poll", {}); },
    async vote(option, prev) {
      const c = store.get(P + "poll", {});
      if (prev && c[prev]) c[prev]--;
      c[option] = (c[option] || 0) + 1;
      store.set(P + "poll", c); return c;
    },
    async apply(data, account) {
      const all = store.get(P + "applications", []), roster = store.get(P + "roster", []);
      const taken = (C.portal.demoAccounts || []).concat(roster).some((r) => account && String(r.id).toLowerCase() === account.id.toLowerCase());
      if (taken || (account && all.some((a) => a.uid && String(a.uid).toLowerCase() === account.id.toLowerCase())))
        throw new Error("이미 사용 중인 아이디입니다. 다른 아이디를 입력해 주세요.");
      if (data.sid && all.some((a) => a.sid && a.sid === data.sid)) throw new Error("이미 가입한 학번입니다. '내 강의실'에서 로그인해 주세요.");
      all.push({ ...data, at: new Date().toISOString() }); store.set(P + "applications", all);
      if (account) { roster.push(account); store.set(P + "roster", roster); }   // 내 강의실 계정 만들기
      return { ok: true };
    },
    async login(id, pin) {
      const accounts = (C.portal.demoAccounts || []).concat(store.get(P + "roster", []));   // 체험 계정 + 관리자가 등록한 명단

  function confetti(opts = {}) {
    if (reduceMotion) return;
    const cv = document.createElement("canvas");
    cv.className = "confetti"; document.body.appendChild(cv);
    const ctx = cv.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = (cv.width = innerWidth * dpr), H = (cv.height = innerHeight * dpr);
    const colors = ["#f08bb4", "#e66a9d", "#fbcfe1", "#a98be8", "#ddd0fb", "#ffd36e", "#ffffff"];
    const parts = [];
    const burst = (x, y, n, angle, spread, speed) => {
      for (let i = 0; i < n; i++) {
        const a = angle + (Math.random() - 0.5) * spread, v = speed * (0.55 + Math.random() * 0.6) * dpr;
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: (5 + Math.random() * 6) * dpr,
          c: colors[(Math.random() * colors.length) | 0], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
          shape: Math.random() < 0.35 ? "petal" : Math.random() < 0.6 ? "rect" : "circle", life: 1 });
      }
    };
    const n = opts.count || 90;
    burst(0, H * 0.85, n, -Math.PI / 3.2, 0.9, 19);
    burst(W, H * 0.85, n, -Math.PI + Math.PI / 3.2, 0.9, 19);
    setTimeout(() => burst(W / 2, H * 0.35, n * 0.8, -Math.PI / 2, Math.PI * 2, 11), 350);
    const t0 = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, W, H);
      for (const p of parts) {
        p.vy += 0.32 * dpr; p.vx *= 0.985; p.vy *= 0.985;
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if (now - t0 > 2200) p.life -= 0.012;
        ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        if (p.shape === "rect") ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        else if (p.shape === "circle") { ctx.beginPath(); ctx.arc(0, 0, p.s / 2.6, 0, 7); ctx.fill(); }
        else { ctx.beginPath(); ctx.ellipse(0, 0, p.s / 1.6, p.s / 3.2, 0, 0, 7); ctx.fill(); }
        ctx.restore();
      }
      if (now - t0 < 4800) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }

  function validate(form, focusFirst) {
    const data = {}, errors = [];
    A.fields.forEach((f) => {
      const box = $(`[data-field="${f.name}"]`, form), errEl = $(".field__err", box);
      let val, msg = "";
      if (f.type === "checkbox") val = $$(`input[name="${f.name}"]:checked`, form).map((i) => i.value);
      else if (f.type === "radio") val = ($(`input[name="${f.name}"]:checked`, form) || {}).value || "";
      else if (f.type === "agree") val = $(`#f-${f.name}`, form).checked ? "동의" : "";
      else val = $(`#f-${f.name}`, form).value.trim();
      const empty = Array.isArray(val) ? val.length === 0 : !val;
      if (f.required && empty) msg = f.type === "agree" || f.type === "checkbox" ? (f.message || `${josa(f.label)} 선택해 주세요.`) : `${josa(f.label)} ${f.type === "select" || f.type === "radio" ? "선택" : "입력"}해 주세요.`;
      else if (!empty && f.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) msg = f.message || "이메일 형식을 확인해 주세요.";

      else if (!empty && f.minLength && String(val).length < f.minLength) msg = f.message || `${f.minLength}자 이상 입력해 주세요.`;
      else if (!empty && f.match && val !== ($(`#f-${f.match}`, form) || {}).value) msg = f.message || "값이 서로 다릅니다.";
      box.classList.toggle("has-error", !!msg);
      errEl.textContent = msg ? "⚠ " + msg : "";
      if (msg) errors.push({ f, msg });
      data[f.name] = Array.isArray(val) ? val.join(", ") : val;
    });

    if (!okExt.includes(ext)) { err.textContent = `⚠ 제출할 수 없는 파일 형식입니다. (${okExt.join(", ")})`; return; }
    if (file.size > PT.upload.maxMB * 1048576) { err.textContent = `⚠ 파일이 너무 큽니다. ${PT.upload.maxMB}MB 이하로 올려 주세요. (현재 ${fmtSize(file.size)})`; return; }
    chosenFile = file; btn.disabled = false;
    $(".drop").classList.add("has-file");
    $(".drop__text").innerHTML = `<b>${esc(file.name)}</b>`;
    $(".drop small").textContent = fmtSize(file.size) + " · 다른 파일을 고르려면 다시 누르세요";
  }

  const portal = $("#portal");
  portal.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (e.target.classList.contains("login")) {
      const id = $("#lg-id").value.trim(), pin = $("#lg-pin").value.trim(), err = $(".login__err");
      const missing = [!id && "아이디", !pin && "비밀번호"].filter(Boolean);
      if (missing.length) { err.textContent = `⚠ ${josa(missing.join("과 "))} 입력해 주세요.`; (!id ? $("#lg-id") : $("#lg-pin")).focus(); return; }
      const b = $("button[type=submit]", e.target); b.disabled = true; b.textContent = "확인 중…";
      try {
        user = await api.login(id, pin); store.sset(P + "session", user);
        toast(`${user.name}님, 로그인되었습니다.`);
        await refreshStatus();
      } catch (ex) { err.textContent = "⚠ " + (ex.message || "로그인하지 못했습니다."); b.disabled = false; b.textContent = "로그인"; }
    }
    if (e.target.classList.contains("upload")) {
      if (!chosenFile) { $(".upload__err").textContent = "⚠ 제출할 파일을 선택해 주세요."; return; }
      const week = Number($("#up-week").value), b = $("button[type=submit]", e.target);
      b.disabled = true; b.innerHTML = `<span class="spinner"></span> 업로드 중…`;
      try {
        await api.submit(user, week, chosenFile);
        const late = weeks[week].dueDate && new Date() > weeks[week].dueDate;
        toast(late ? "제출되었습니다. (마감 이후 제출로 기록됩니다)" : "과제가 제출되었습니다! 🎉");
        chosenFile = null; await refreshStatus();
      } catch (ex) { $(".upload__err").textContent = "⚠ " + (ex.message || "제출하지 못했습니다."); b.disabled = false; b.textContent = "제출하기"; }
    }
  });
  portal.addEventListener("click", async (e) => {
    if (e.target.closest("[data-demo-fill]")) { const d = PT.demoAccounts[0]; $("#lg-id").value = d.id; $("#lg-pin").value = d.pin; return; }
    if (e.target.closest("[data-logout]")) { user = null; store.sset(P + "session", null); toast("로그아웃되었습니다."); return renderPortal(); }
    const at = e.target.closest("[data-attend]");
    if (at) {
      const w = Number(at.dataset.attend), codeEl = $(`[data-code="${w}"]`), code = codeEl ? codeEl.value.trim() : "";
      if (codeEl && !code) { toast("출석 코드를 입력해 주세요.", "is-error"); codeEl.focus(); return; }
      at.disabled = true;
      try { await api.attend(user, w, code); toast(`${weeks[w].tag} 출석이 확인되었습니다 ✅`); await refreshStatus(); }
      catch (ex) { toast(ex.message || "출석하지 못했습니다.", "is-error"); at.disabled = false; }
    }
  });
  portal.addEventListener("change", (e) => {
    if (e.target.id === "up-week") showDue();
    if (e.target.id === "up-file") pickFile(e.target.files[0]);
  });
  portal.addEventListener("keydown", (e) => { if (e.target.classList.contains("drop") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $("#up-file").click(); } });
  ["dragenter", "dragover"].forEach((t) => portal.addEventListener(t, (e) => { const d = e.target.closest(".drop"); if (d) { e.preventDefault(); d.classList.add("is-drag"); } }));
  ["dragleave", "drop"].forEach((t) => portal.addEventListener(t, (e) => {
    const d = e.target.closest(".drop"); if (!d) return;
    e.preventDefault(); d.classList.remove("is-drag");
    if (t === "drop" && e.dataTransfer.files[0]) pickFile(e.dataTransfer.files[0]);
  }));

  // 커리큘럼·달력의 '과제 제출하기' 버튼 → 내 강의실로 이동
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-submit-week]"); if (!b) return;
    pendingWeek = Number(b.dataset.submitWeek);
    if (user) { renderPortal(); }
    scrollToEl(portal);
    if (!user) { toast("로그인 후 과제를 제출할 수 있어요."); setTimeout(() => $("#lg-id") && $("#lg-id").focus({ preventScroll: true }), 500); }
  });

  // 가입 후 바로 로그인
  let pendingLogin = null;
  document.addEventListener("click", async (e) => {
    if (!e.target.closest("[data-login-now]") || !pendingLogin) return;
    try {
      user = await api.login(pendingLogin.id, pendingLogin.pin); store.sset(P + "session", user);
      pendingLogin = null; toast(`${user.name}님, 로그인되었습니다.`);
      await refreshStatus(); scrollToEl(portal);
    } catch (ex) { toast(ex.message || "로그인하지 못했습니다.", "is-error"); }
  });
  // 가입 양식 다시 쓰기
  document.addEventListener("click", (e) => { if (e.target.closest("[data-reapply]")) { renderApplyForm(); scrollToEl($("#apply")); } });
  // 오류 요약의 항목 링크 → 해당 칸으로
  document.addEventListener("click", (e) => {
    const j = e.target.closest("[data-jump]"); if (!j) return;
    e.preventDefault();
    const el = $(`#f-${j.dataset.jump}`) || $(`input[name="${j.dataset.jump}"]`);
    if (el) { scrollToEl(el.closest(".field") || el); setTimeout(() => (el.matches("input,select,textarea") ? el : $("input", el)).focus({ preventScroll: true }), 350); }
  });

  renderApplyForm();
  refreshStatus();

  /* ================= 4. 수강 신청 안내 팝업 ================= */
  const PU = C.popup;
  function maybePopup() {
    if (!PU || !PU.enabled) return;
    const hideUntil = store.get(P + "popupHideUntil", 0);
    const deadline = PU.deadline ? parseDT(PU.deadline) : null;
    if (Date.now() < hideUntil || store.get(P + "applied", false) || store.sget(P + "admin") || /[?&]quiz=/.test(location.search) || (deadline && new Date() > deadline)) return;
    setTimeout(openPopup, (PU.delaySeconds || 2.5) * 1000);
    function openPopup() {
      if ($(".modal")) return;
      const last = document.activeElement;
      const m = document.createElement("div");
      m.className = "modal";
      m.innerHTML = `
        <div class="modal__backdrop" data-close></div>
        <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="pop-title" tabindex="-1">
          <button class="modal__x" data-close aria-label="닫기">×</button>
          <div class="modal__art">🌸</div>
          <span class="badge">${esc(PU.badge)}</span>
          <h3 id="pop-title">${esc(PU.title).replace(/\n/g, "<br>")}</h3>
          <p>${esc(PU.text)}</p>
          <ul class="modal__list">${list(PU.highlights, (h) => `<li>${esc(h)}</li>`)}</ul>
          ${deadline ? `<p class="modal__deadline">신청 마감 <b>${fmtDue(deadline)}</b> ${dueBadge(deadline)}</p>` : ""}
          <a class="btn btn--primary modal__cta" href="#apply" data-cta>${esc(PU.ctaLabel)} →</a>
          <div class="modal__foot">
            <label class="agree"><input type="checkbox" class="modal__today"><span>오늘 하루 보지 않기</span></label>
            <button class="link-btn" data-close>닫기</button>
          </div>
        </div>`;
      document.body.appendChild(m);
      document.body.classList.add("no-scroll");
      requestAnimationFrame(() => m.classList.add("is-open"));
      const dlg = $(".modal__dialog", m); dlg.focus();
      const close = () => {
        if ($(".modal__today", m).checked) {
          const t = new Date(); t.setHours(24, 0, 0, 0);       // 오늘 자정까지
          store.set(P + "popupHideUntil", t.getTime());
        }
        m.classList.remove("is-open"); document.body.classList.remove("no-scroll");
        setTimeout(() => m.remove(), 300);
        document.removeEventListener("keydown", onKey);
        last && last.focus && last.focus({ preventScroll: true });
      };
      const onKey = (e) => {
        if (e.key === "Escape") close();
        if (e.key === "Tab") {   // 팝업 안에서만 포커스 이동
          const f = $$("a,button,input", dlg); const first = f[0], lastF = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); lastF.focus(); }
          else if (!e.shiftKey && document.activeElement === lastF) { e.preventDefault(); first.focus(); }
        }
      };
      document.addEventListener("keydown", onKey);
      m.addEventListener("click", (e) => {
        if (e.target.closest("[data-cta]")) { e.preventDefault(); e.stopPropagation(); close(); setTimeout(() => scrollToEl($("#apply")), 150); return; }
        if (e.target.closest("[data-close]")) close();
      });
    }
  }

  // 관리자 화면(admin.js)에서 함께 사용
  window.__PART = { api, store, P, REMOTE, remote, toast, confetti, scrollToEl, josa };

  /* ================= 5. 첫 방문 환영 폭죽 ================= */
  if (C.celebrate && C.celebrate.firstVisit && !store.get(P + "visited", false)) {
    store.set(P + "visited", true);
    setTimeout(() => { confetti(); toast(C.celebrate.message); }, 600);
  }
  maybePopup();
})();

</script>
<script id="admin-js" data-bundle="1">
/* =====================================================================
 *  admin.js — 공지사항 표시 + 관리자 모드
 *  (자물쇠 → 비밀번호 → 콘텐츠 편집 · 공지 · 수강생 명단 · 기록 조회/내려받기 · 설정 파일)
 *  이 파일은 고칠 필요가 없습니다.
 * ===================================================================== */
(function () {
  "use strict";
  const C = window.SITE_CONFIG, S = window.__SITE, X = window.__PART;
  if (!C || !S || !X) return;
  const { esc, list, $, $$, weeks, fmtDay, pad2 } = S;
  const { store, P, REMOTE, remote, toast } = X;
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
  const fmtAt = (iso) => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? String(iso) : `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

  /* ================= SHA-256 (비밀번호 확인용) ================= */
  async function sha256(text) {
    try {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
      }
    } catch (_) {}
    return sha256js(text);
  }
  function sha256js(text) {   // crypto.subtle 을 쓸 수 없는 환경용 예비 구현
    const bytes = Array.from(new TextEncoder().encode(text));
    const K = [], H = [];
    let n = 2, c = 0;
    const isPrime = (x) => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; };
    while (c < 64) { if (isPrime(n)) { if (c < 8) H[c] = (Math.pow(n, 1 / 2) * 2 ** 32) | 0; K[c++] = (Math.pow(n, 1 / 3) * 2 ** 32) | 0; } n++; }
    const l = bytes.length * 8;
    bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (l >>> (i * 8)) & 255);
    const rot = (x, y) => (x >>> y) | (x << (32 - y));
    for (let i = 0; i < bytes.length; i += 64) {
      const w = [];
      for (let j = 0; j < 64; j++) {
        if (j < 16) w[j] = (bytes[i + j * 4] << 24) | (bytes[i + j * 4 + 1] << 16) | (bytes[i + j * 4 + 2] << 8) | bytes[i + j * 4 + 3];
        else {
          const s0 = rot(w[j - 15], 7) ^ rot(w[j - 15], 18) ^ (w[j - 15] >>> 3), s1 = rot(w[j - 2], 17) ^ rot(w[j - 2], 19) ^ (w[j - 2] >>> 10);
          w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
        }
      }
      let [a, b, cc, d, e, f, g, h] = H;
      for (let j = 0; j < 64; j++) {
        const t1 = (h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & f) ^ (~e & g)) + K[j] + w[j]) | 0;
        const t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
      }
      [a, b, cc, d, e, f, g, h].forEach((v, k) => (H[k] = (H[k] + v) | 0));
    }
    return H.map((v) => (v >>> 0).toString(16).padStart(8, "0")).join("");
  }

  /* ================= 공지사항 (사이트 화면) ================= */
  const noticeBox = $("#notice");
  // 📌 고정 공지가 맨 위, 그다음 최신순
  const sortNotices = (arr) => (arr || []).slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || String(b.date).localeCompare(String(a.date)) || String(b.createdAt || "").localeCompare(String(a.createdAt || "")));   // 같은 날짜면 나중에 쓴 글이 위
  const NOTICE_PER_PAGE = 3;   // 첫 화면 공지사항: 한 페이지에 3개씩
  let noticeItems = [], noticePage = 1;
  function renderNotices(items, keepPage) {
    noticeItems = sortNotices(items);
    if (!noticeItems.length) { noticeBox.hidden = true; noticeBox.innerHTML = ""; return; }
    noticeBox.hidden = false;
    if (!keepPage) noticePage = 1;
    drawNoticePage();
  }
  function drawNoticePage() {
    const items = noticeItems, pages = Math.max(1, Math.ceil(items.length / NOTICE_PER_PAGE));
    noticePage = Math.min(Math.max(1, noticePage), pages);
    const start = (noticePage - 1) * NOTICE_PER_PAGE, cur = items.slice(start, start + NOTICE_PER_PAGE);
    const isNew = (d) => (Date.now() - new Date(d + "T00:00").getTime()) / 864e5 < 3;
    noticeBox.innerHTML = `
      <div class="card notice-board">
        <div class="notice-board__head"><h2>📢 공지사항</h2><span>${items.length}건${pages > 1 ? ` · ${noticePage}/${pages} 페이지` : ""}</span></div>
        <div class="notice-list">
          ${list(cur, (n, i) => `
            <details class="notice ${n.important ? "is-important" : ""} ${n.pinned ? "is-pinned" : ""}" ${i === 0 && noticePage === 1 ? "open" : ""}>
              <summary>
                <span class="notice__no">${start + i + 1}</span>
                ${n.pinned ? `<span class="notice__pin" title="고정 공지">📌</span>` : ""}
                ${n.important ? `<span class="pill pill--hw">중요</span>` : ""}
                <span class="notice__title">${esc(n.title)}</span>
                ${isNew(n.date) ? `<span class="notice__new">N</span>` : ""}
                <time>${esc(n.date)}${n.updated && n.updated !== n.date ? ` <small>(${esc(n.updated)} 수정)</small>` : ""}</time>
              </summary>
              <p>${esc(n.body).replace(/\n/g, "<br>")}</p>
            </details>`)}
        </div>
        ${pages > 1 ? `<nav class="pager" aria-label="공지사항 페이지">
          <button class="pager__btn" data-npage="${noticePage - 1}" ${noticePage === 1 ? "disabled" : ""} aria-label="이전 페이지">‹</button>
          ${list(Array.from({ length: pages }, (_, k) => k + 1), (k) => `<button class="pager__btn ${k === noticePage ? "is-on" : ""}" data-npage="${k}" aria-label="${k}페이지" ${k === noticePage ? 'aria-current="page"' : ""}>${k}</button>`)}
          <button class="pager__btn" data-npage="${noticePage + 1}" ${noticePage === pages ? "disabled" : ""} aria-label="다음 페이지">›</button>
        </nav>` : ""}
      </div>`;
  }
  noticeBox.addEventListener("click", (e) => {
    const b = e.target.closest("[data-npage]"); if (!b || b.disabled) return;
    noticePage = Number(b.dataset.npage); drawNoticePage();
    const f = $(`[data-npage="${noticePage}"]`, noticeBox); f && f.focus({ preventScroll: true });
  });
  renderNotices(C.notices);
  if (REMOTE) remote.get({ action: "notices" }).then((j) => { if (j.notices && j.notices.length) renderNotices(j.notices); }).catch(() => {});

  /* ---------- 공지 팝업 (🔔 팝업으로 설정한 공지를 접속 시 띄우기) ---------- */
  function showNoticePopup(items) {
    const today = todayStr();
    const hideKey = (n) => P + "npopHide." + n.id;
    const list2 = sortNotices(items).filter((n) => n.popup && (!n.popupUntil || n.popupUntil >= today) && Date.now() >= store.get(hideKey(n), 0));
    if (!list2.length || store.sget(P + "admin") || /[?&]quiz=/.test(location.search) || $(".modal")) return;
    let idx = 0;
    const m = document.createElement("div");
    m.className = "modal npop";
    m.innerHTML = `
      <div class="modal__backdrop" data-close></div>
      <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="np-title" tabindex="-1">
        <button class="modal__x" data-close aria-label="닫기">×</button>
        <span class="badge">📢 공지사항</span>
        <div class="npop__body"></div>
        <div class="npop__nav" ${list2.length > 1 ? "" : "hidden"}><button class="link-btn" data-np="-1">‹ 이전</button><span class="npop__count"></span><button class="link-btn" data-np="1">다음 ›</button></div>
        <div class="modal__foot">
          <label class="agree"><input type="checkbox" class="npop__today"><span>오늘 하루 보지 않기</span></label>
          <button class="link-btn" data-close>닫기</button>
        </div>
      </div>`;
    const draw = () => {
      const n = list2[idx];
      $(".npop__body", m).innerHTML = `
        <h3 id="np-title">${n.pinned ? "📌 " : ""}${esc(n.title)}</h3>
        <p class="npop__date">${n.important ? `<span class="pill pill--hw">중요</span> ` : ""}${esc(n.date)}</p>
        <div class="npop__text">${esc(n.body).replace(/\n/g, "<br>")}</div>`;
      $(".npop__count", m).textContent = `${idx + 1} / ${list2.length}`;
    };
    draw();
    document.body.appendChild(m); document.body.classList.add("no-scroll");
    requestAnimationFrame(() => m.classList.add("is-open"));
    $(".modal__dialog", m).focus();
    const close = () => {
      if ($(".npop__today", m).checked) { const t = new Date(); t.setHours(24, 0, 0, 0); list2.forEach((n) => store.set(hideKey(n), t.getTime())); }
      m.classList.remove("is-open"); document.body.classList.remove("no-scroll");
      setTimeout(() => m.remove(), 300); document.removeEventListener("keydown", onKey);
    };
    const onKey = (e) => { if (e.key === "Escape") close(); if (e.key === "ArrowRight" && list2.length > 1) { idx = (idx + 1) % list2.length; draw(); } if (e.key === "ArrowLeft" && list2.length > 1) { idx = (idx - 1 + list2.length) % list2.length; draw(); } };
    document.addEventListener("keydown", onKey);
    m.addEventListener("click", (e) => {
      const nb = e.target.closest("[data-np]");
      if (nb) { idx = (idx + Number(nb.dataset.np) + list2.length) % list2.length; return draw(); }
      if (e.target.closest("[data-close]")) close();
    });
  }
  // 회원가입 안내 팝업(2.5초)보다 먼저 띄우기
  if (REMOTE) remote.get({ action: "notices" }).then((j) => setTimeout(() => showNoticePopup(j.notices && j.notices.length ? j.notices : C.notices), 600)).catch(() => setTimeout(() => showNoticePopup(C.notices), 1200));
  else setTimeout(() => showNoticePopup(C.notices), 1200);

  /* ================= 관리자 로그인 ================= */
  const lockBtn = $(".admin-lock");
  let session = store.sget(P + "admin");          // { ok: true, key: (운영 모드 서버 확인용) }
  const setLockState = () => { lockBtn.classList.toggle("is-unlocked", !!session); lockBtn.setAttribute("aria-label", session ? "관리자 화면 열기" : "관리자 로그인"); };
  setLockState();
  lockBtn.addEventListener("click", () => (session ? openAdmin() : openLogin()));

  let afterLogin = null;   // 다른 기능(실시간 퀴즈 등)에서 로그인 후 이어서 실행할 동작
  window.__ADMIN = {
    session: () => session,
    login: (cb) => { afterLogin = cb; openLogin(); }
  };

  function openLogin() {
    if ($(".modal")) return;
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `
      <div class="modal__backdrop" data-close></div>
      <form class="modal__dialog admin-login" role="dialog" aria-modal="true" aria-labelledby="al-title" tabindex="-1" novalidate>
        <button type="button" class="modal__x" data-close aria-label="닫기">×</button>
        <div class="modal__art">🔒</div>

  // 사진을 적당한 크기의 JPEG 로 줄여 data URL 로 만들기 (index.html 한 파일에 담기 위해)
  function shrinkImage(file, max) {
    return new Promise((res, rej) => {
      const img = new Image(), fr = new FileReader();
      fr.onload = () => { img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.85));
      }; img.onerror = rej; img.src = fr.result; };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
  }

        s.late ? "지각" : "정상", ...(REMOTE ? [s.url || ""] : [])]),

      html: { 6: (c) => `<span class="pill ${c === "지각" ? "pill--miss" : "pill--ok"}">${esc(c)}</span>`, 7: (c) => c ? `<a href="${esc(c)}" target="_blank" rel="noopener">열기</a>` : "" }
    };
  }
  function downloadCSV(name, headers, rows) {
    const cell = (v) => {
      let s = String(v ?? "");
      if (/^[=+\-@]/.test(s)) s = "'" + s;                 // 엑셀 수식 주입 방지
      return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const csv = "﻿" + [headers, ...rows].map((r) => r.map(cell).join(",")).join("\r\n");   // BOM: 엑셀 한글 깨짐 방지
    download(`${name}_${todayStr()}.csv`, csv, "text/csv;charset=utf-8");
  }
  function download(name, text, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }

    }
    if (t.classList.contains("f-import") && t.files[0]) {
      const err = $(".f-err", panel);
      try {
        const cfg = parseConfigFile(await t.files[0].text());
        if (!cfg || !cfg.site || !cfg.nav) throw new Error("사이트 설정 파일 형식이 아닙니다.");

        setTimeout(() => saveOverride(cfg, true, "files"), 600);
      } catch (ex) { err.textContent = "⚠ 불러오지 못했습니다: " + ex.message; }

  }

    if (!panel || !panel.contains(e.target)) return;

    const f = e.target;

      const v = apiFormValues(f);
      if (!v.key) return apiMsg(f, "⚠ API 키를 입력해 주세요.", true);
      if (v.prov === "baze" && !/^https:\/\//i.test(v.base)) return apiMsg(f, "⚠ API 주소를 https:// 로 시작하게 입력해 주세요.", true);

      if (editNotice) item.updated = todayStr();   // 수정한 날짜 기록

        var b2 = read();

        if (c < 128) {

    for (var i = 8; i < 256; i += 1) {
      EXP_TABLE[i] = EXP_TABLE[i - 4]
        ^ EXP_TABLE[i - 5]
        ^ EXP_TABLE[i - 6]
        ^ EXP_TABLE[i - 8];

    for (var i = 0; i < 255; i += 1) {
      LOG_TABLE[EXP_TABLE[i] ] = i;

      if (n < 1) {
        throw 'glog(' + n + ')';
      }

      return LOG_TABLE[n];
    };

    _this.gexp = function(n) {

      while (n < 0) {
        n += 255;
      }

      while (n >= 256) {
        n -= 255;
      }

      return EXP_TABLE[n];
    };

    return _this;
  }();

  function qrPolynomial(num, shift) {

      throw num.length + '/' + shift;

        offset += 1;

      var _num = new Array(num.length - offset + shift);

    _this.getLength = function() {

      var num = new Array(_this.getLength() + e.getLength() - 1);

      for (var i = 0; i < _this.getLength(); i += 1) {
        for (var j = 0; j < e.getLength(); j += 1) {
          num[i + j] ^= QRMath.gexp(QRMath.glog(_this.getAt(i) ) + QRMath.glog(e.getAt(j) ) );
        }
      }

      return qrPolynomial(num, 0);
    };

    _this.mod = function(e) {

      if (_this.getLength() - e.getLength() < 0) {
        return _this;
      }

      var ratio = QRMath.glog(_this.getAt(0) ) - QRMath.glog(e.getAt(0) );

      var num = new Array(_this.getLength() );
      for (var i = 0; i < _this.getLength(); i += 1) {
        num[i] = _this.getAt(i);
      }

      for (var i = 0; i < e.getLength(); i += 1) {
        num[i] ^= QRMath.gexp(QRMath.glog(e.getAt(i) ) + ratio);
      }

      // recursive call
      return qrPolynomial(num, 0).mod(e);
    };

    return _this;
  };

    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = `${name}_${stamp}.csv`; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function normalize(raw, defTime) {
    if (!raw || typeof raw !== "object") return null;
    let opts = Array.isArray(raw.options) ? raw.options.map((o) => String(o ?? "").trim()) : [];
    let type = raw.type === "ox" || (opts.length === 2 && /^o$/i.test(opts[0]) && /^x$/i.test(opts[1])) ? "ox" : "mc";
    if (type === "ox") opts = ["O", "X"];
    opts = opts.filter(Boolean).slice(0, 4);
    let ans = raw.answer;
    if (typeof ans === "string") {
      const t = ans.trim(); const idx = opts.findIndex((o) => o === t);
      ans = idx >= 0 ? idx : /^[0-9]+$/.test(t) ? Number(t) : type === "ox" ? (/^o|true|맞/i.test(t) ? 0 : 1) : -1;
    }
    if (typeof ans === "boolean") ans = ans ? 0 : 1;
    const text = String(raw.text || raw.question || "").trim();
    if (!text || opts.length < 2 || !(ans >= 0 && ans < opts.length)) return null;
    const time = [10, 15, 20, 30, 45, 60].includes(Number(raw.time)) ? Number(raw.time) : defTime || 20;
    return { type, time, text: text.slice(0, 300), options: opts.map((o) => o.slice(0, 80)), answer: Number(ans), explain: String(raw.explain || "").trim().slice(0, 400) };
  }
  function parseAI(text) {
    const s = String(text || "").replace(/```(json)?/gi, "");

    if (a < 0 || b < a) throw new Error("응답에서 JSON 배열 [ ... ] 을 찾지 못했습니다.");
    const arr = JSON.parse(s.slice(a, b + 1));
    if (!Array.isArray(arr)) throw new Error("문항 배열이 아닙니다.");
    return arr;
  }

  /* ---------- AI 호출 (Claude · BAZE) — 관리자 'API 키 설정'에서도 함께 사용 ---------- */
  const BAZE_DEFAULT_URL = "https://api.baze.co/v1/gateway";
  const aiSettings = () => ({
    claude: { key: store.get(P + "quizApiKey", ""), model: store.get(P + "quizModel", "") || (Q.ai && Q.ai.model) || "" },
    baze: {
      key: store.get(P + "bazeKey", ""),
      base: store.get(P + "bazeUrl", "") || ((Q.ai && Q.ai.baze) || {}).baseUrl || BAZE_DEFAULT_URL,
      model: store.get(P + "bazeModel", "") || ((Q.ai && Q.ai.baze) || {}).model || "",
      fmt: store.get(P + "bazeFmt", "") || ((Q.ai && Q.ai.baze) || {}).format || "openai"
    },
    preferred: store.get(P + "aiDefault", "copy")
  });
  const netError = (ex, who) => new Error(ex.message === "Failed to fetch" ? `${who} 서버에 연결하지 못했습니다. 주소·인터넷 연결을 확인하거나 ① 복사 방식을 써 주세요.` : ex.message);
  async function readJSON(r) { const t = await r.text(); try { return JSON.parse(t); } catch (_) { return { message: t.slice(0, 200) }; } }
  const errMsg = (j, r) => (j.error && (j.error.message || (typeof j.error === "string" ? j.error : ""))) || j.message || j.detail || `요청 실패 (${r.status})`;
  async function callClaude(promptText, o) {
    let r, j;
    try {
      r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "content-type": "application/json", "x-api-key": o.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: o.model, max_tokens: o.max || 4000, messages: [{ role: "user", content: promptText }] })
      });
      j = await readJSON(r);
    } catch (ex) { throw netError(ex, "Anthropic"); }
    if (!r.ok) throw new Error(errMsg(j, r));
    return (j.content || []).map((c) => c.text || "").join("");
  }
  // BAZE 게이트웨이: OpenAI 호환(…/gateway/chat/completions) 또는 Claude 계열(…/gateway/claude/v1/messages)
  function bazeEndpoint(base, fmt) {
    base = String(base || BAZE_DEFAULT_URL).replace(/\/+$/, "");
    if (/\/(chat\/completions|messages)$/.test(base)) return base;
    if (fmt === "anthropic") {
      if (/\/v1$/.test(base) && /\/claude\/v1$/.test(base)) return base + "/messages";
      if (/\/claude$/.test(base)) return base + "/v1/messages";
      if (/\/gateway$/.test(base)) return base + "/claude/v1/messages";
      return base + "/messages";
    }
    return base + "/chat/completions";
  }
  async function callBaze(promptText, o) {
    const url = bazeEndpoint(o.base, o.fmt);
    const headers = o.fmt === "anthropic"
      ? { "content-type": "application/json", "x-api-key": o.key, "anthropic-version": "2023-06-01" }
      : { "content-type": "application/json", "Authorization": "Bearer " + o.key };
    let r, j;
    try { r = await fetch(url, { method: "POST", headers, body: JSON.stringify({ model: o.model, max_tokens: o.max || 4000, messages: [{ role: "user", content: promptText }] }) }); j = await readJSON(r); }
    catch (ex) { throw netError(ex, "BAZE"); }
    if (!r.ok) throw new Error(errMsg(j, r));
    const text = o.fmt === "anthropic" ? (j.content || []).map((c) => c.text || "").join("")
      : ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "");
    if (!text) throw new Error("응답에서 생성된 글을 찾지 못했습니다. 요청 형식(OpenAI/Anthropic 호환)을 바꿔 보세요.");
    return text;
  }
  async function listBazeModels(o) {
    const base = String(o.base || BAZE_DEFAULT_URL).replace(/\/+$/, "").replace(/\/(claude(\/v1)?|chat\/completions|messages)$/, "");
    let r, j;
    try { r = await fetch(base + "/models/", { headers: { "Authorization": "Bearer " + o.key } }); j = await readJSON(r); }

  /* ---------- 3-4. 결과 정리 · CSV ---------- */
  function studentRows() {
    const players = Object.values(H.results.players), qs = H.quiz.questions;
    const rows = players.map((p) => {
      const per = qs.map((_, i) => (H.results.perQ[i] || {})[p.pid] || null);
      const score = per.reduce((s, a) => s + (a ? a.points : 0), 0);
      return { pid: p.pid, name: p.name, sid: p.sid || "", per, score, right: per.filter((a) => a && a.correct).length, answered: per.filter(Boolean).length };
    }).sort((a, b) => b.score - a.score);
    let last = null, r = 0; rows.forEach((x, i) => { if (x.score !== last) { r = i + 1; last = x.score; } x.rank = r; });
    return rows;
  }
  function csvStudents() {
    const qs = H.quiz.questions, rows = studentRows();
    const head = ["순위", "이름", "아이디", "총점", "정답 수", "응답 수", "정답률(%)"];
    qs.forEach((_, i) => head.push(`Q${i + 1} 응답`, `Q${i + 1} 정오`, `Q${i + 1} 점수`, `Q${i + 1} 응답시간(초)`));
    const body = rows.map((x) => {
      const r = [x.rank, x.name, x.sid, x.score, x.right, x.answered, Math.round((x.right / qs.length) * 100)];
      x.per.forEach((a, i) => r.push(a ? qs[i].options[a.choice] : "무응답", a ? (a.correct ? "O" : "X") : "", a ? a.points : 0, a ? (a.ms / 1000).toFixed(1) : ""));
      return r;
    });
    downloadCSV(`퀴즈결과_학생별_${H.quiz.title}`, head, body);
  }
  function csvItems() {
    const qs = H.quiz.questions, n = Object.keys(H.results.players).length;
    const head = ["번호", "유형", "문제", "정답", "참여자", "응답자", "정답자", "정답률(%)", "평균 응답시간(초)", "보기1 선택", "보기2 선택", "보기3 선택", "보기4 선택", "해설"];
    const body = qs.map((q, i) => {
      const a = Object.values(H.results.perQ[i] || {}).filter(Boolean), right = a.filter((x) => x.correct).length;
      const cnt = [0, 1, 2, 3].map((k) => (q.options[k] != null ? `${q.options[k]}: ${a.filter((x) => x.choice === k).length}` : ""));
      return [i + 1, q.type === "ox" ? "O/X" : "4지선다", q.text, q.options[q.answer], n, a.length, right,
        a.length ? Math.round((right / a.length) * 100) : 0, a.length ? (a.reduce((s, x) => s + x.ms, 0) / a.length / 1000).toFixed(1) : "", ...cnt, q.explain || ""];
    });
    downloadCSV(`퀴즈결과_문항별_${H.quiz.title}`, head, body);
  }

  async function onHostClick(e) {

      if (qop.dataset.qop === "up" && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
      if (qop.dataset.qop === "down" && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
      H.dirty = true; return renderSetup();
    }
    const b = t.closest("[data-h]"); if (!b) return;
    const set = H.sets[H.setIdx];
    switch (b.dataset.h) {

        if (H.screen !== "setup" && H.screen !== "final" && b.dataset.confirm !== "1") { b.dataset.confirm = "1"; toast("진행 중인 퀴즈가 종료됩니다. 닫으려면 × 를 한 번 더 누르세요.", "is-error"); return; }
        if (H.screen === "setup" && H.dirty && b.dataset.confirm !== "1") { b.dataset.confirm = "1"; toast("저장하지 않은 문항이 있어요. 닫으려면 한 번 더 누르세요.", "is-error"); return; }
        return closeHost();
      case "newset": H.sets.push({ id: "q" + Date.now().toString(36), title: "새 퀴즈", questions: [] }); H.setIdx = H.sets.length - 1; H.dirty = true; return renderSetup();
      case "dupset": { const c = clone(set); c.id = "q" + Date.now().toString(36); c.title += " (복사본)"; H.sets.push(c); H.setIdx = H.sets.length - 1; H.dirty = true; return renderSetup(); }
      case "delset":
        if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "정말 삭제?"; return; }
        H.sets.splice(H.setIdx, 1); if (!H.sets.length) H.sets.push({ id: "q" + Date.now().toString(36), title: "새 퀴즈", questions: [] });
        H.setIdx = 0; H.dirty = true; return renderSetup();
      case "addq": set.questions.push({ type: "mc", time: 20, text: "", options: ["", "", "", ""], answer: 0, explain: "" }); H.dirty = true; renderSetup();
        { const last = $$(".qe", H.el).at(-1); last.scrollIntoView({ block: "center" }); $("textarea", last).focus({ preventScroll: true }); } return;
      case "ai": return openAI();
      case "save": saveSets(H.sets); H.dirty = false; renderSetup(); return toast("퀴즈를 저장했어요. 다른 기기에도 쓰려면 관리자 → 설정 저장에서 사이트 파일을 내려받아 교체하세요.");
      case "launch": return launch();
      case "studenttab": return window.open(joinUrl(H.pin), "_blank", "noopener");
      case "start": b.disabled = true; return pollHost("start");
      case "reveal": H.revealSent = H.snap.state.qIndex; return pollHost("reveal");
      case "board": return pollHost("leaderboard");
      case "next": b.disabled = true; return pollHost("next");
      case "csv-students": return csvStudents();
      case "csv-items": return csvItems();
      case "sheet": {
        b.disabled = true;
        try {
          const qs = H.quiz.questions, at = new Date().toISOString();
          const rows = studentRows().map((x) => [at, H.quiz.title, H.pin, x.rank, x.name, x.sid, x.score, x.right, qs.length,
            x.per.map((a, i) => (a ? `Q${i + 1}:${a.correct ? "O" : "X"}` : `Q${i + 1}:-`)).join(" ")]);
          await T.save(rows); toast("구글 시트 '퀴즈결과'에 저장했어요.");
        } catch (ex) { toast(ex.message, "is-error"); b.disabled = false; }
        return;
      }
      case "again": clearInterval(H.timer); H.pin = null; return renderSetup();
    }
  }
  function onHostInput(e) {
    const t = e.target;
    if (t.dataset.f === "title") { H.sets[H.setIdx].title = t.value; H.dirty = true; showDirty(); return; }
    const box = t.closest("[data-q]"); if (!box || !t.dataset.qf) return;
    const q = H.sets[H.setIdx].questions[Number(box.dataset.q)];
    switch (t.dataset.qf) {
      case "text": q.text = t.value; break;
      case "explain": q.explain = t.value; break;
      case "time": q.time = Number(t.value); break;
      case "answer": q.answer = Number(t.value); break;
      case "opt": q.options[Number(t.dataset.k)] = t.value; break;
      case "type":
        if (e.type !== "change") return;
        q.type = t.value;
        if (q.type === "ox") { q.options = ["O", "X"]; if (q.answer > 1) q.answer = 0; }
        else { q.options = [0, 1, 2, 3].map((k) => (q.options[k] && !/^[OX]$/.test(q.options[k]) ? q.options[k] : "")); }
        H.dirty = true; return renderSetup();
    }
    H.dirty = true; showDirty();
  }
  const showDirty = () => { const d = $(".qs__actions .ed__dirty", H.el); if (d) d.hidden = false; };
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !H || $(".qh-modal", H.el)) return;
    const x = $("[data-h=close]", H.el); x && x.click();
  });
})();

</script>

  <section id="s1">

    <p>사이트 전체가 <b>index.html 파일 하나</b>에 들어 있습니다. 서버 없이 더블클릭하면 바로 열립니다. (크롬·엣지·사파리 최신 버전 권장)</p>
    <table>
      <tr><th>파일 안의 부분</th><th>역할</th></tr>
      <tr><td>디자인(style)</td><td>분홍·보라 색상과 레이아웃. 맨 위 <code>:root</code>에서 색을 바꿀 수 있음</td></tr>

  </section>

  <section id="s2">
    <h2><span class="num">2</span>화면 구성</h2>
    <table>
      <tr><th>메뉴</th><th>내용</th></tr>
      <tr><td>첫 화면</td><td>배지·제목·부제·설명, 회원가입/커리큘럼 버튼, 일정·시간·방식·대상 카드, 공지사항</td></tr>
      <tr><td>프로그램 소개</td><td>숫자 통계 카드(카운트 애니메이션), 강의 장점 슬라이드</td></tr>
      <tr><td>커리큘럼</td><td>주차별 펼쳐보기(날짜·시간·장소·학습 내용·참고 영상·과제·마감 카운트다운·제출 버튼), 월간 달력</td></tr>
      <tr><td>수강 안내</td><td>교재와 참고자료, 준비물, 가입 방법, 회원가입(빠진 항목 안내 · 가입 즉시 내 강의실 계정 생성)</td></tr>
      <tr><td>참여하기</td><td>주제 투표, 내 강의실(로그인·출석·과제 제출), <b>실시간 퀴즈</b></td></tr>
      <tr><td>FAQ · 교수자</td><td>자주 묻는 질문, 교수자 사진·소개·연락처 푸터</td></tr>
      <tr><td>그 밖에</td><td>첫 방문 환영 폭죽, 회원가입 안내 팝업(오늘 하루 보지 않기), 맨 위로 버튼, 오른쪽 위 🔒 관리자</td></tr>
    </table>
  </section>

  <section id="s3">
    <h2><span class="num">3</span>내용 고치기</h2>
    <h3>관리자 화면에서 고치기 (권장)</h3>
    <ol>
      <li>오른쪽 위 🔒 → 관리자 비밀번호 입력</li>
      <li><b>콘텐츠 편집</b>에서 고칠 부분(첫 화면, 커리큘럼·일정, FAQ, 교수자 사진…)을 고르고 내용을 바꿈. 항목은 ＋ 추가 / ✕ 삭제 / ↑↓ 순서 변경</li>
      <li><b>저장하고 반영</b> → 이 브라우저에 바로 적용</li>
      <li><b>설정 저장 → index.html 내려받기</b> → 기존 index.html 을 내려받은 파일로 교체 (배포했다면 다시 올리기)</li>
    </ol>
    <div class="warn">⚠ 3번까지는 <b>지금 쓰는 브라우저에만</b> 적용됩니다. 학생들에게 보이게 하려면 4번처럼 파일을 교체해야 합니다. 새 파일을 열면 브라우저에 남아 있던 예전 수정본은 자동으로 정리됩니다.</div>
    <h3>파일을 직접 고칠 때</h3>
    <p>메모장이나 VS Code로 index.html 을 열고 <code>window.SITE_CONFIG</code>를 찾아 따옴표 안의 글자를 바꾼 뒤 저장 → 새로고침합니다.</p>
    <h3>자주 고치는 설정</h3>
    <table>
      <tr><th>바꾸고 싶은 것</th><th>관리자 → 콘텐츠 편집 위치</th></tr>
      <tr><td>개강일 (이후 주차·달력 자동 계산)</td><td>커리큘럼·일정 → 첫 수업일 <code>startDate</code></td></tr>
      <tr><td>한 주만 날짜 변경(휴강·보강)</td><td>해당 주차에 <code>date: "2026-11-12"</code> 추가 (파일 직접 수정)</td></tr>
      <tr><td>과제 마감</td><td>커리큘럼·일정 → 주차 → 과제 → 마감 <code>due</code></td></tr>
      <tr><td>가입 마감·팝업 문구</td><td>신청 안내 팝업</td></tr>
      <tr><td>투표 항목 · 가입 항목</td><td>주제 투표 · 회원가입</td></tr>
      <tr><td>출석 가능 시간 · 업로드 형식</td><td>내 강의실</td></tr>
      <tr><td>퀴즈 QR 주소 · 문항</td><td>실시간 퀴즈 (문항은 퀴즈 진행 화면에서 편집 권장)</td></tr>
    </table>
  </section>

  <section id="s4">
    <h2><span class="num">4</span>관리자 모드</h2>
    <p>오른쪽 위 <b>🔒 자물쇠</b>를 누르고 비밀번호를 입력합니다. 초기 비밀번호는 사이트를 받을 때 따로 안내받은 값이며, <b>처음 들어가자마자 바꿔 주세요.</b> (설정 저장 → 관리자 비밀번호 변경 → index.html 내려받아 교체)</p>
    <table>
      <tr><th>탭</th><th>할 수 있는 일</th></tr>
      <tr><td>📊 대시보드</td><td>신청·명단·출석·과제·투표·공지 현황, 실시간 퀴즈 바로가기</td></tr>
      <tr><td>✏️ 콘텐츠 편집</td><td>사이트 정보와 모든 섹션 내용, 교수자 사진 올리기</td></tr>
      <tr><td>📢 공지</td><td>공지 작성·수정·삭제, ‘중요’ 공지는 맨 위 고정</td></tr>
      <tr><td>👥 수강생 명단</td><td>아이디·이름·비밀번호 등록 (회원가입한 학생은 자동 등록). 엑셀 붙여넣기, CSV 불러오기, 가입자에서 가져오기, CSV 내려받기</td></tr>
      <tr><td>📋 기록·내려받기</td><td>회원가입 / 주차별 출석 현황 / 과제 제출 내역 → <b>엑셀(CSV)</b> 내려받기</td></tr>
      <tr><td>💾 설정 저장</td><td>index.html 내려받기, 설정 백업(.json)·불러오기, 수정본 지우기, 비밀번호 변경, Apps Script 코드, 체험 데이터 지우기</td></tr>
    </table>
    <div class="warn">⚠ <b>보안 안내</b> — 비밀번호는 원문이 아닌 해시값으로만 저장되고, 5번 틀리면 30초간 잠깁니다. 서버가 없는 사이트의 관리자 화면은 '화면 잠금' 수준이므로 <b>짐작하기 어려운 비밀번호(10자 이상)</b>를 쓰세요. 학생 개인정보는 운영 모드에서 구글 시트에만 저장되고, 서버가 관리자 비밀번호를 다시 확인한 뒤에만 내려줍니다.</div>
  </section>

  <section id="s5">
    <h2><span class="num">5</span>체험 모드와 운영 모드</h2>
    <table>
      <tr><th></th><th>체험 모드 (기본값)</th><th>운영 모드</th></tr>
      <tr><td>설정</td><td><code>backend.url</code> 비움</td><td><code>backend.url</code>에 Apps Script 주소</td></tr>
      <tr><td>데이터 저장</td><td>각자의 브라우저에만</td><td>교수자 구글 시트·드라이브</td></tr>
      <tr><td>투표 · 실시간 퀴즈</td><td>같은 브라우저의 탭끼리만</td><td>모든 학생 휴대폰에서 함께</td></tr>
      <tr><td>로그인</td><td>체험 계정·이 브라우저에 등록한 명단</td><td>'학생' 시트의 명단</td></tr>
      <tr><td>과제 파일</td><td>파일 이름만 기록</td><td>드라이브 '관절염생체역학_과제제출/n주차' 폴더</td></tr>
      <tr><td>용도</td><td>시연·연습</td><td>실제 수업</td></tr>
    </table>
    <h3>운영 모드 연결 (약 10분)</h3>
    <ol>
      <li>구글 드라이브 → 새 스프레드시트 만들기 (예: "관절염 생체역학 운영")</li>
      <li>사이트 관리자 → 설정 저장 → <b>Apps Script 코드 복사</b></li>
      <li>스프레드시트 [확장 프로그램] → [Apps Script] → 기존 내용을 지우고 붙여 넣기</li>
      <li>맨 위 <code>const ADMIN_KEY = "";</code> 따옴표 안에 <b>사이트 관리자 비밀번호와 같은 값</b>을 적고 저장</li>
      <li>함수 목록에서 <code>setup</code> 선택 → [실행] → 권한 허용 → 시트 8개와 과제 폴더가 생김</li>
      <li>[배포] → [새 배포] → 유형 <b>웹 앱</b>, 실행: <b>나</b>, 액세스: <b>모든 사용자</b> → 웹 앱 URL 복사</li>
      <li>사이트 관리자 → 콘텐츠 편집 → <b>데이터 저장(운영 모드)</b> → url 에 붙여 넣기 → 저장하고 반영 → index.html 내려받아 교체</li>
      <li>관리자 → 수강생 명단 등록 → (학생이 직접 회원가입하면 자동 등록) 직접 등록한 학생에게는 아이디·비밀번호 개별 안내</li>
    </ol>
    <div class="tip">💡 출석 부정을 막으려면 '내 강의실 → 출석 설정 → 출석 코드 사용'을 켜고, '출석코드' 시트에 <code>주차 | 코드 | 출석가능</code>을 적어 수업 중에 코드를 알려 주세요.</div>
    <div class="tip">💡 Apps Script 코드를 고쳤다면 [배포] → [배포 관리] → ✏️ → 버전 '새 버전' → 배포 해야 반영됩니다. (URL은 그대로)</div>
  </section>

  <section id="s9">
    <h2><span class="num">6</span>실시간 퀴즈 (Kahoot · Socrative 방식)</h2>
    <h3>교수자</h3>
    <ol>
      <li>참여하기 맨 아래 <b>🔒 교수자: 퀴즈 진행하기</b> (또는 관리자 대시보드 → 실시간 퀴즈 진행)</li>
      <li>퀴즈를 고르거나 <b>＋ 새 퀴즈</b> → 문항 편집 (4지선다·O/X, 제한 시간, 정답, 해설)</li>
      <li><b>🤖 AI로 문제 만들기</b>
        <ul>
