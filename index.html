<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>관절염 생체역학 | 고려대학교 의학과</title>
  <!-- 「관절염 생체역학」 강의 운영 사이트 — 이 파일 하나에 디자인·설정·기능·안내서가 모두 들어 있습니다. 내용 수정은 오른쪽 위 🔒 관리자 화면에서. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style id="site-css">
/* ===== 색상·모양 토큰 (분위기를 바꾸려면 여기만 수정) ===== */
:root {
  --pink-50: #fff5f9;
  --pink-100: #ffe4ef;
  --pink-200: #fbcfe1;
  --pink-400: #f08bb4;
  --pink-500: #e66a9d;
  --lav-100: #efe7ff;
  --lav-200: #ddd0fb;
  --lav-400: #a98be8;
  --lav-600: #7b5cc9;
  --lav-800: #4a3780;
  --ink: #3d2c45;
  --ink-soft: #6f5f78;
  --line: rgba(169, 139, 232, .22);
  --card: rgba(255, 255, 255, .8);
  --radius: 22px;
  --radius-sm: 14px;
  --shadow: 0 10px 30px -12px rgba(123, 92, 201, .28);
  --header-h: 68px;
  --grad: linear-gradient(135deg, var(--pink-400), var(--lav-400));
  /* 페이지 배경 — 옅은 갈색(베이지·모카) 톤 */
  --bg-crimson-1: #f7f0e8;
  --bg-crimson-2: #ecdccb;
  --bg-crimson-3: #f2e6d9;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  font-family: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color: var(--ink);
  line-height: 1.7;
  background:
    radial-gradient(1200px 600px at 10% -10%, var(--bg-crimson-2), transparent 60%),
    radial-gradient(900px 600px at 100% 10%, var(--bg-crimson-3), transparent 60%),
    linear-gradient(180deg, var(--bg-crimson-1), #faf6f1 60%, var(--bg-crimson-1));
  background-color: var(--bg-crimson-1);
  background-attachment: fixed;
  word-break: keep-all;
}
a { color: inherit; }
section[id], footer[id] { scroll-margin-top: calc(var(--header-h) + 12px); }
h3 { line-height: 1.4; }

/* ===== 헤더 ===== */
.header {
  position: sticky; top: 0; z-index: 50; height: var(--header-h);
  background: rgba(247, 240, 232, .85);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line); transition: box-shadow .25s;
}
.header.is-scrolled { box-shadow: 0 6px 24px -14px rgba(123, 92, 201, .45); }
.header__inner {
  max-width: 1120px; height: 100%; margin: 0 auto; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand__mark {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  color: #fff; font-size: 20px; background: var(--grad); box-shadow: var(--shadow);
}
.brand__text { display: flex; flex-direction: column; line-height: 1.2; }
.brand__text strong { font-size: 16px; }
.brand__text small { font-size: 12px; color: var(--ink-soft); }
.nav { display: flex; gap: 4px; }
.nav a {
  text-decoration: none; font-size: 15px; font-weight: 500; padding: 8px 14px;
  border-radius: 999px; color: var(--ink-soft); transition: background .2s, color .2s;
}
.nav a:hover { background: var(--pink-100); color: var(--ink); }
.nav a.is-active { background: var(--grad); color: #fff; }
.menu-toggle {
  display: none; width: 42px; height: 42px; border: 0; border-radius: 12px;
  background: var(--pink-100); cursor: pointer; padding: 10px;
  flex-direction: column; justify-content: space-between;
}
.menu-toggle span { display: block; height: 2px; border-radius: 2px; background: var(--ink); transition: transform .25s, opacity .25s; }
.menu-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
.menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.menu-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

/* ===== 공통 ===== */
main { max-width: 1120px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }
.section { padding: 80px 0 16px; }
.section__head { text-align: center; max-width: 680px; margin: 0 auto 36px; }
.sub-head .section__head { margin-top: 72px; }
.eyebrow {
  display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--lav-600); background: var(--lav-100); padding: 4px 14px; border-radius: 999px;
}
.section__head h2 { font-size: clamp(26px, 4vw, 36px); margin: 12px 0 8px; font-weight: 800; }
.section__head p { margin: 0; color: var(--ink-soft); }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 26px; transition: transform .25s, box-shadow .25s;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -16px rgba(230, 106, 157, .4); }
.card h3 { margin: 0 0 6px; font-size: 18px; }
.card p { margin: 0; color: var(--ink-soft); font-size: 15px; }
.grid { display: grid; gap: 20px; }
.grid--4 { grid-template-columns: repeat(4, 1fr); }
.grid--3 { grid-template-columns: repeat(3, 1fr); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; cursor: pointer;
  font: inherit; font-size: 16px; font-weight: 700; padding: 14px 30px; border-radius: 999px; border: 0;
  transition: transform .2s, box-shadow .2s;
}
.btn--primary { background: var(--grad); color: #fff; box-shadow: 0 12px 26px -10px rgba(230, 106, 157, .7); }
.btn--ghost { background: rgba(255,255,255,.85); color: var(--lav-600); border: 1.5px solid var(--lav-200); }
.btn:hover { transform: translateY(-2px); }

.feature__icon {
  width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; font-size: 26px;
  background: linear-gradient(135deg, var(--pink-100), var(--lav-100)); margin-bottom: 14px;
}

/* ===== 첫 화면 ===== */
.hero-wrap { padding-top: 28px; }
.hero {
  text-align: center; padding: 72px 40px 64px; border-radius: 36px;
  background:
    radial-gradient(520px 320px at 92% 8%, rgba(169,139,232,.38), transparent 70%),
    radial-gradient(460px 320px at 4% 100%, rgba(240,139,180,.38), transparent 70%),
    rgba(255,255,255,.62);
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
.badge {
  display: inline-block; font-size: 14px; font-weight: 700; color: #fff;
  background: var(--grad); padding: 7px 18px; border-radius: 999px; box-shadow: var(--shadow);
}
.hero h1 { font-size: clamp(38px, 7vw, 68px); line-height: 1.15; margin: 22px 0 10px; font-weight: 800; letter-spacing: -.02em; }
.hero__sub {
  font-size: clamp(20px, 3.2vw, 30px); font-weight: 700; margin: 0 0 20px;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero__desc { max-width: 640px; margin: 0 auto 32px; color: var(--ink-soft); font-size: 17px; }
.hero__buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.hero__en { margin: 26px 0 0; font-size: 14px; color: var(--lav-600); font-weight: 500; letter-spacing: .03em; }

.overview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 20px; }
.overview__item { display: flex; gap: 14px; align-items: flex-start; padding: 20px; }
.overview__icon {
  flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 22px;
  background: linear-gradient(135deg, var(--pink-100), var(--lav-100));
}
.overview__item div { display: flex; flex-direction: column; line-height: 1.45; min-width: 0; }
.overview__label { font-size: 13px; font-weight: 700; color: var(--lav-600); }
.overview__item strong { font-size: 15px; }
.overview__item small { font-size: 13px; color: var(--ink-soft); }

/* ===== 통계 ===== */
.stat { text-align: center; padding: 30px 20px; }
.stat strong {
  display: block; font-size: clamp(34px, 5vw, 48px); font-weight: 800; line-height: 1.1;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  font-variant-numeric: tabular-nums;
}
.stat span { color: var(--ink-soft); font-weight: 500; }

/* ===== 장점 슬라이드 ===== */
.slider { position: relative; padding: 0 28px; }
.slider__track {
  display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 40px) / 3); column-gap: 20px;
  overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  padding: 8px 0 24px; outline: none;
}
.slider__track::-webkit-scrollbar { display: none; }
.slide { scroll-snap-align: start; position: relative; min-height: 230px; }
.slide:hover { transform: translateY(-4px); }
.slide__num { position: absolute; top: 20px; right: 24px; font-size: 28px; font-weight: 800; color: var(--lav-200); }
.slide__icon {
  width: 60px; height: 60px; border-radius: 20px; display: grid; place-items: center; font-size: 30px;
  background: var(--grad); margin-bottom: 18px; box-shadow: var(--shadow);
}
.slide h3 { font-size: 19px; }
.slider__nav {
  position: absolute; top: calc(50% - 30px); transform: translateY(-50%); z-index: 2;
  width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer;
  background: #fff; color: var(--lav-600); font-size: 26px; line-height: 1; box-shadow: var(--shadow);
  transition: opacity .2s, transform .2s;
}
.slider__nav--prev { left: 0; }
.slider__nav--next { right: 0; }
.slider__nav:hover:not(:disabled) { transform: translateY(-50%) scale(1.08); }
.slider__nav:disabled { opacity: .35; cursor: default; }
.slider__dots { display: flex; justify-content: center; gap: 8px; }
.slider__dots button {
  width: 10px; height: 10px; padding: 0; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--lav-200); transition: width .25s, background .25s;
}
.slider__dots button.is-active { width: 28px; background: var(--grad); }

/* ===== 커리큘럼 ===== */
.module__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.module__tag { font-size: 13px; font-weight: 700; color: #fff; background: var(--grad); padding: 3px 12px; border-radius: 999px; }
.module__weeks { font-size: 13px; color: var(--lav-600); font-weight: 700; }
.module h3 { margin: 6px 0 12px; font-size: 20px; }
.module ul { margin: 0; padding: 0; list-style: none; }
.module li { padding: 8px 0 8px 22px; position: relative; border-top: 1px dashed var(--line); color: var(--ink-soft); font-size: 15px; }
.module li::before { content: "✿"; position: absolute; left: 0; color: var(--pink-400); font-size: 12px; top: 10px; }

/* ===== AI 도구 ===== */
.tool__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.tool__icon {
  width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; font-size: 24px;
  background: linear-gradient(135deg, var(--pink-100), var(--lav-100));
}
.tool__use { font-size: 12px; font-weight: 700; color: var(--pink-500); background: var(--pink-100); padding: 3px 10px; border-radius: 999px; }

/* ===== 준비물·신청 ===== */
.prep { text-align: center; }
.prep .feature__icon { margin: 0 auto 14px; }
.apply {
  margin-top: 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center;
  background: linear-gradient(135deg, rgba(255,228,239,.9), rgba(239,231,255,.9));
}
.apply:hover { transform: none; }
.apply h3 { margin: 0; white-space: nowrap; }
.apply ol { margin: 0; padding-left: 20px; color: var(--ink-soft); font-size: 15px; }

/* ===== FAQ ===== */
.faq-list { max-width: 820px; margin: 0 auto; display: grid; gap: 14px; }
.card.faq-item { padding: 0; overflow: hidden; }
.faq-item:hover { transform: none; }
.faq-item summary { list-style: none; cursor: pointer; padding: 20px 60px 20px 24px; font-weight: 700; position: relative; }
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::before { content: "Q"; color: var(--pink-500); margin-right: 10px; font-weight: 800; }
.faq-item summary::after {
  content: "+"; position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--lav-100); color: var(--lav-600); font-size: 18px; transition: transform .25s;
}
.faq-item[open] summary::after { transform: translateY(-50%) rotate(45deg); }
.faq-item .answer { padding: 0 24px 20px 48px; color: var(--ink-soft); }

/* ===== 교수자 푸터 ===== */
.footer {
  position: relative; z-index: 1; margin-top: 96px; color: #fff;
  background:
    radial-gradient(600px 300px at 0% 0%, rgba(240,139,180,.45), transparent 70%),
    radial-gradient(600px 300px at 100% 100%, rgba(169,139,232,.5), transparent 70%),
    linear-gradient(135deg, #6a4a9e, var(--lav-800));
  border-radius: 40px 40px 0 0;
}
.footer__inner { max-width: 1120px; margin: 0 auto; padding: 64px 20px 28px; }
.footer__profile { display: grid; grid-template-columns: 180px 1fr 300px; gap: 36px; align-items: center; }
.avatar {
  position: relative; width: 170px; height: 170px; border-radius: 50%; overflow: hidden;
  display: grid; place-items: center; font-size: 46px; font-weight: 800; color: #fff;
  background: var(--grad); box-shadow: 0 0 0 6px rgba(255,255,255,.25), 0 20px 40px -16px rgba(0,0,0,.4);
}
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.eyebrow--light { background: rgba(255,255,255,.16); color: #ffe4ef; }
.footer__bio h3 { margin: 10px 0 0; font-size: 28px; }
.footer__bio .position { margin: 2px 0 12px; color: #f6d4ff; font-weight: 500; }
.footer__bio p { margin: 0; color: rgba(255,255,255,.85); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { font-size: 13px; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.16); color: #fff; font-weight: 500; }
.contacts {
  list-style: none; margin: 0; padding: 20px; display: grid; gap: 12px;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: var(--radius);
}
.contacts li { display: flex; gap: 12px; align-items: center; font-size: 15px; }
.contacts__icon {
  flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
  background: rgba(255,255,255,.16); font-size: 16px;
}
.contacts li > span:last-child { display: flex; flex-direction: column; line-height: 1.4; min-width: 0; overflow-wrap: anywhere; }
.contacts small { font-size: 12px; color: #f6d4ff; }
.contacts a { color: #fff; }
.footer__bottom {
  margin-top: 48px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.18);
  text-align: center; font-size: 13px; color: rgba(255,255,255,.75);
}
.footer__bottom p { margin: 4px 0; }
.footer__bottom strong { color: #fff; }

/* ===== 맨 위로 버튼 ===== */
.to-top {
  position: fixed; right: 22px; bottom: 22px; z-index: 60;
  width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); cursor: pointer;
  background: var(--grad); color: #fff; font-size: 22px; font-weight: 800; box-shadow: var(--shadow);
  opacity: 0; transform: translateY(16px); pointer-events: none; transition: opacity .3s, transform .3s;
}
.to-top.is-visible { opacity: 1; transform: none; pointer-events: auto; }
.to-top:hover { transform: translateY(-3px); }

/* ===== 스크롤 등장 효과 ===== */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity .6s, transform .6s; }
.reveal.is-in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; } }

/* ===== 반응형 ===== */
@media (max-width: 960px) {
  .grid--4, .overview { grid-template-columns: repeat(2, 1fr); }
  .grid--3 { grid-template-columns: repeat(2, 1fr); }
  .slider__track { grid-auto-columns: calc((100% - 20px) / 2); }
  .footer__profile { grid-template-columns: 160px 1fr; }
  .contacts { grid-column: 1 / -1; grid-template-columns: repeat(2, 1fr); }
  .avatar { width: 150px; height: 150px; }
  .apply { grid-template-columns: 1fr; text-align: left; gap: 14px; }
  .apply .btn { justify-self: start; }
}
@media (max-width: 820px) {
  .menu-toggle { display: flex; }
  .nav {
    position: absolute; top: var(--header-h); left: 12px; right: 12px;
    flex-direction: column; gap: 4px; padding: 12px; background: #fffafd;
    border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .nav.is-open { opacity: 1; transform: none; pointer-events: auto; }
  .nav a { padding: 12px 16px; font-size: 16px; }
}
@media (max-width: 640px) {
  :root { --header-h: 60px; }
  main { padding: 0 16px; }
  .brand__text small { display: none; }
  .section { padding: 64px 0 8px; }
  .grid--3 { grid-template-columns: 1fr; }
  .grid--4.stats { gap: 12px; }
  .grid--4:not(.stats) { grid-template-columns: 1fr; }
  .overview { grid-template-columns: 1fr; gap: 10px; }
  .hero-wrap { padding-top: 16px; }
  .hero { padding: 44px 22px 40px; border-radius: 28px; }
  .hero__desc { font-size: 16px; }
  .hero__buttons .btn { flex: 1 1 140px; padding: 14px 18px; }
  .stat { padding: 22px 12px; }
  .card { padding: 22px; }
  .slider { padding: 0; }
  .slider__track { grid-auto-columns: 86%; column-gap: 14px; }
  .slider__nav { display: none; }
  .prep { text-align: left; display: grid; grid-template-columns: auto 1fr; column-gap: 14px; align-items: center; }
  .prep .feature__icon { margin: 0; grid-row: span 2; }
  .footer { border-radius: 28px 28px 0 0; margin-top: 72px; }
  .footer__inner { padding: 48px 16px 24px; }
  .footer__profile { grid-template-columns: 1fr; text-align: center; gap: 22px; }
  .avatar { margin: 0 auto; width: 130px; height: 130px; font-size: 36px; }
  .chips { justify-content: center; }
  .contacts { grid-template-columns: 1fr; text-align: left; }
  .to-top { right: 16px; bottom: 16px; width: 46px; height: 46px; }
}

/* =====================================================================
 *  3단계: 주차별 커리큘럼 · 과제 · 달력
 * ===================================================================== */
.btn--sm { padding: 10px 20px; font-size: 14px; }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }
.muted { color: var(--ink-soft); font-size: 14px; margin: 0; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill--hw { background: var(--pink-100); color: var(--pink-500); }
.pill--done { background: #eeeaf3; color: #8a7d93; }
.pill--today { background: var(--pink-500); color: #fff; }
.pill--next { background: var(--grad); color: #fff; }
.pill--upcoming { background: var(--lav-100); color: var(--lav-600); }

/* 주차 아코디언 */
.weeks { display: grid; gap: 16px; max-width: 920px; margin: 0 auto; }
.card.week { padding: 0; overflow: hidden; }
.week:hover { transform: none; }
.week.is-open { border-color: var(--pink-200); box-shadow: 0 18px 40px -18px rgba(230, 106, 157, .45); }
.week__head {
  width: 100%; display: flex; align-items: center; gap: 16px; padding: 20px 24px;
  background: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer;
}
.week__head:focus-visible { outline: 3px solid var(--lav-200); outline-offset: -3px; border-radius: var(--radius); }
.week__tag {
  flex: none; font-size: 14px; font-weight: 800; color: #fff; background: var(--grad);
  padding: 8px 14px; border-radius: 14px;
}
.week__title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.4; }
.week__title small { font-size: 13px; color: var(--lav-600); font-weight: 500; }
.week__title strong { font-size: 19px; }
.week__badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.week__chev {
  flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--lav-100); position: relative;
  transition: transform .3s, background .3s;
}
.week__chev::before {
  content: ""; position: absolute; left: 50%; top: 45%; width: 8px; height: 8px;
  border-right: 2px solid var(--lav-600); border-bottom: 2px solid var(--lav-600);
  transform: translate(-50%, -50%) rotate(45deg);
}
.week.is-open .week__chev { transform: rotate(180deg); background: var(--pink-100); }
.week__panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
.week.is-open .week__panel { grid-template-rows: 1fr; }
.week__inner { overflow: hidden; }
.week__body { padding: 0 24px 24px; border-top: 1px dashed var(--line); margin: 0 24px; padding: 20px 0 24px; }
.week__summary { font-size: 16px !important; color: var(--ink) !important; font-weight: 500; margin-bottom: 14px !important; }
.week__meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.week__meta span { font-size: 14px; background: var(--pink-50); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }
.week__meta b { color: var(--lav-600); margin: 0 4px 0 2px; }
.week__grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
.week h4, .cal-detail h4 { margin: 0 0 10px; font-size: 15px; color: var(--lav-600); }
.topics { margin: 0; padding: 0; list-style: none; counter-reset: t; }
.topics li { counter-increment: t; position: relative; padding: 6px 0 6px 34px; font-size: 15px; color: var(--ink-soft); }
.topics li::before {
  content: counter(t); position: absolute; left: 0; top: 7px; width: 24px; height: 24px; border-radius: 8px;
  display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--pink-500); background: var(--pink-100);
}
.videos { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.videos a {
  display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 14px; font-weight: 500;
  padding: 10px 14px; border-radius: var(--radius-sm); background: #fff; border: 1px solid var(--line);
  transition: border-color .2s, transform .2s;
}
.videos a:hover { border-color: var(--pink-400); transform: translateX(3px); }
.videos__play {
  flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font-size: 11px; color: #fff; background: var(--grad);
}
.no-hw { margin-top: 20px; }

/* 과제 박스 */
.assignment {
  margin-top: 22px; padding: 20px; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, rgba(255,228,239,.85), rgba(239,231,255,.85));
  border: 1px solid var(--pink-200);
}
.assignment__head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.assignment__head h4 { margin: 0; color: var(--ink); font-size: 16px; }
.assignment > p { font-size: 15px; margin-bottom: 14px; }
.assignment__foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.assignment__due { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.assignment__due b { color: var(--ink); }
.countdown {
  align-self: flex-start; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
  background: #fff; color: var(--lav-600); border: 1px solid var(--lav-200); font-variant-numeric: tabular-nums;
}
.countdown.is-soon { color: #c0548a; border-color: var(--pink-200); }
.countdown.is-urgent { background: var(--pink-500); color: #fff; border-color: transparent; }
.countdown.is-over { background: #eeeaf3; color: #8a7d93; border-color: transparent; }
.assignment--mini { margin-top: 14px; padding: 16px; }
.assignment--mini .btn { margin-top: 12px; }

/* 달력 */
.cal-wrap { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }
.cal:hover, .cal-detail:hover { transform: none; }
.cal__top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.cal__title { flex: 1; text-align: center; margin: 0 !important; font-size: 21px !important; font-weight: 800; }
.cal__nav, .cal__today {
  border: 1px solid var(--line); background: #fff; cursor: pointer; font: inherit; color: var(--lav-600);
  transition: background .2s;
}
.cal__nav { width: 40px; height: 40px; border-radius: 50%; font-size: 24px; line-height: 1; }
.cal__today { order: -1; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.cal__nav:hover, .cal__today:hover { background: var(--pink-100); }
.cal__legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--ink-soft); margin-bottom: 14px; }
.cal__legend span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot--class { background: var(--grad); }
.dot--due { background: #fff; border: 2px solid var(--pink-500); }
.dot--today { background: #fff; border: 2px solid var(--lav-600); }
.cal__dow, .cal__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal__dow span { text-align: center; font-size: 13px; font-weight: 700; color: var(--ink-soft); padding-bottom: 4px; }
.cal__dow span:first-child { color: var(--pink-500); }
.cal__dow span:last-child { color: var(--lav-600); }
.cal__day {
  min-height: 74px; border-radius: 14px; border: 1px solid transparent; background: rgba(255,255,255,.55);
  font: inherit; color: var(--ink); cursor: pointer; padding: 6px; display: flex; flex-direction: column;
  align-items: center; gap: 3px; transition: background .2s, border-color .2s, transform .15s;
}
.cal__day.is-empty { background: none; cursor: default; }
.cal__day:not(.is-empty):hover { background: var(--pink-50); border-color: var(--pink-200); }
.cal__num { font-size: 14px; font-weight: 500; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.cal__day.is-sun .cal__num { color: var(--pink-500); }
.cal__day.is-sat .cal__num { color: var(--lav-600); }
.cal__day.is-today .cal__num { box-shadow: inset 0 0 0 2px var(--lav-600); font-weight: 800; }
.cal__day.is-class { background: linear-gradient(160deg, var(--pink-100), var(--lav-100)); }
.cal__day.is-selected { border-color: var(--pink-500); box-shadow: 0 6px 16px -8px rgba(230,106,157,.7); transform: translateY(-1px); }
.cal__ev { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
.cal__ev--class { background: var(--grad); color: #fff; }
.cal__ev--due { background: #fff; color: var(--pink-500); border: 1px solid var(--pink-400); }

.cal-detail { position: sticky; top: calc(var(--header-h) + 16px); }
.cal-detail__date { display: block; font-size: 13px; font-weight: 700; color: var(--lav-600); margin-bottom: 10px; }
.cal-detail__head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.cal-detail__head h3 { margin: 0 !important; font-size: 19px !important; }
.cal-detail__head .week__tag { font-size: 13px; padding: 5px 10px; border-radius: 10px; }
.cal-detail__meta { list-style: none; margin: 0 0 16px; padding: 0; font-size: 14px; color: var(--ink-soft); display: grid; gap: 2px; }
.cal-detail .topics { margin-bottom: 16px; }
.cal-detail__empty { text-align: center; padding: 24px 0 8px; }
.cal-detail__empty span { font-size: 34px; }
.cal-detail__empty p { margin: 6px 0 12px; }
.link-btn { background: none; border: 0; font: inherit; font-size: 14px; font-weight: 700; color: var(--pink-500); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

@media (max-width: 960px) {
  .cal-wrap { grid-template-columns: 1fr; }
  .cal-detail { position: static; }
}
@media (max-width: 640px) {
  .week__head { flex-wrap: wrap; gap: 10px 12px; padding: 18px; }
  .week__tag { padding: 6px 10px; font-size: 13px; }
  .week__title { flex-basis: calc(100% - 140px); }
  .week__title strong { font-size: 17px; }
  .week__badges { order: 5; width: 100%; justify-content: flex-start; padding-left: 2px; }
  .week__chev { order: 3; }
  .week__body { margin: 0 18px; padding: 18px 0 20px; }
  .week__grid { grid-template-columns: 1fr; gap: 18px; }
  .assignment__foot .btn { width: 100%; }
  .cal { padding: 16px 12px; }
  .cal__dow, .cal__grid { gap: 3px; }
  .cal__day { min-height: 56px; padding: 4px 2px; border-radius: 10px; }
  .cal__num { font-size: 13px; width: 24px; height: 24px; }
  .cal__ev { font-size: 0; width: 7px; height: 7px; padding: 0; border-radius: 50%; }
  .cal__ev--due { border-width: 2px; }
  .cal__title { font-size: 18px !important; }
}

/* =====================================================================
 *  4단계: 참여 기능 (신청서 · 투표 · 내 강의실 · 팝업 · 토스트 · 폭죽)
 * ===================================================================== */
.mode-note { font-size: 13px; color: var(--ink-soft); background: var(--lav-100); border-radius: 12px; padding: 8px 12px; margin: 12px 0 0; }
.mode-note b { color: var(--lav-600); }
.pill--ok { background: #e3f6ec; color: #2f8a5b; }
.pill--miss { background: #fde8ee; color: #c0446f; }
.no-scroll { overflow: hidden; }

/* 신청서 */
.apply-card { max-width: 920px; margin: 0 auto; padding: 32px; }
.apply-card:hover, .poll:hover, .portal:hover { transform: none; }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 20px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; }
.field--wide, .field--agree { grid-column: 1 / -1; }
.field__label { font-size: 14px; font-weight: 700; color: var(--ink); }
.req { color: var(--pink-500); }
.field input:not([type=radio]):not([type=checkbox]), .field select, .field textarea,
.login input, .upload select, .att__code {
  font: inherit; font-size: 15px; color: var(--ink); width: 100%;
  padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--lav-200); background: #fff;
  transition: border-color .2s, box-shadow .2s;
}
.field textarea { resize: vertical; min-height: 110px; }
.field input:focus, .field select:focus, .field textarea:focus, .login input:focus, .upload select:focus, .att__code:focus {
  outline: none; border-color: var(--lav-400); box-shadow: 0 0 0 4px rgba(169,139,232,.18);
}
.char-count { position: absolute; right: 12px; bottom: 34px; font-size: 12px; color: var(--ink-soft); pointer-events: none; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice span {
  display: inline-block; padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--lav-200); background: #fff;
  font-size: 14px; font-weight: 500; cursor: pointer; transition: all .2s;
}
.choice input:checked + span { background: var(--grad); color: #fff; border-color: transparent; }
.choice input:focus-visible + span { box-shadow: 0 0 0 4px rgba(169,139,232,.3); }
.agree { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; cursor: pointer; }
.agree input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--pink-500); flex: none; }
.field__err { margin: 0; min-height: 0; font-size: 13px; font-weight: 500; color: #c0446f; }
.field__err:empty { display: none; }
.field.has-error input:not([type=radio]):not([type=checkbox]), .field.has-error select, .field.has-error textarea { border-color: #e66a9d; background: #fff7fa; }
.field.has-error .choice span { border-color: #f3a9c5; }
.form-summary {
  margin-bottom: 22px; padding: 16px 20px; border-radius: 16px;
  background: #fff1f6; border: 1.5px solid #f3a9c5; color: #a8365f; font-size: 14px;
}
.form-summary ul { margin: 8px 0 0; padding-left: 18px; }
.form-summary a { color: #a8365f; font-weight: 700; }
.form-actions { margin-top: 26px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.form-actions .mode-note { margin: 0; }
.apply-done { text-align: center; padding: 24px 0; }
.apply-done__icon { font-size: 54px; }
.apply-done h3 { font-size: 24px; margin: 8px 0; }
.apply-done p { margin-bottom: 20px !important; }

/* 투표 · 내 강의실 */
.participate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.poll__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.poll h3, .portal h3 { font-size: 22px; margin-bottom: 4px; }
.poll__lead { margin-bottom: 18px !important; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--pink-500); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--pink-500); animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(230,106,157,.6); } 100% { box-shadow: 0 0 0 10px rgba(230,106,157,0); } }
.poll__chart { display: grid; gap: 10px; }
.poll__opt {
  position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--lav-200); background: #fff;
  font: inherit; color: var(--ink); text-align: left; cursor: pointer; transition: border-color .2s, transform .15s;
}
.poll__opt:hover { border-color: var(--pink-400); transform: translateX(2px); }
.poll__opt.is-mine { border-color: var(--pink-500); box-shadow: 0 8px 20px -12px rgba(230,106,157,.7); }
.poll__bar {
  position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--pink-100), var(--lav-100));
  transition: width .8s cubic-bezier(.2,.8,.2,1); z-index: 0;
}
.poll__opt.is-top .poll__bar { background: linear-gradient(90deg, var(--pink-200), var(--lav-200)); }
.poll__label, .poll__num { position: relative; z-index: 1; }
.poll__label { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px; min-width: 0; }
.poll__label em { font-style: normal; font-size: 11px; font-weight: 700; color: #fff; background: var(--pink-500); padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.poll__icon { font-size: 18px; }
.poll__num { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; flex: none; }
.poll__num b { font-size: 17px; color: var(--lav-600); }
.poll__num small { font-size: 12px; color: var(--ink-soft); }
.poll__total { font-size: 13px !important; margin-top: 14px !important; text-align: center; }

.login { display: grid; gap: 8px; }
.login .btn { margin-top: 8px; }
.me { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: linear-gradient(135deg, var(--pink-50), var(--lav-100)); }
.me div { flex: 1; display: flex; flex-direction: column; line-height: 1.4; }
.me small { color: var(--ink-soft); font-size: 13px; }
.me__avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--grad); color: #fff; font-weight: 800; }
.portal__h { font-size: 16px; margin: 24px 0 10px; color: var(--ink); }
.att, .subs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.att li, .subs li {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 14px; border-radius: 14px; background: #fff; border: 1px solid var(--line);
}
.att li > div:first-child { display: flex; flex-direction: column; line-height: 1.4; }
.att small { font-size: 12px; color: var(--ink-soft); }
.att__act { display: flex; gap: 6px; align-items: center; }
.att__code { width: 96px !important; padding: 8px 10px !important; font-size: 14px !important; }
.upload { display: grid; gap: 8px; }
.upload__due { font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.drop {
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; cursor: pointer;
  padding: 22px 16px; border-radius: 18px; border: 2px dashed var(--lav-200); background: var(--pink-50);
  transition: border-color .2s, background .2s;
}
.drop:hover, .drop:focus-visible, .drop.is-drag { border-color: var(--pink-400); background: var(--pink-100); outline: none; }
.drop.has-file { border-style: solid; border-color: var(--lav-400); background: #fff; }
.drop__icon { font-size: 26px; }
.drop__text { font-size: 14px; overflow-wrap: anywhere; }
.drop small { font-size: 12px; color: var(--ink-soft); }
.upload .btn { margin-top: 4px; }
.subs { margin-top: 14px; }
.subs li { font-size: 14px; }
.subs li > span:first-child { font-weight: 700; flex: none; }
.subs__file { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-soft); }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 팝업 */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; }
.modal__backdrop { position: absolute; inset: 0; background: rgba(61, 44, 69, .45); backdrop-filter: blur(4px); opacity: 0; transition: opacity .3s; }
.modal__dialog {
  position: relative; width: min(440px, 100%); max-height: calc(100vh - 32px); overflow: auto;
  background: linear-gradient(180deg, #fff, var(--pink-50)); border-radius: 28px; padding: 34px 28px 20px; text-align: center;
  box-shadow: 0 30px 80px -20px rgba(74, 55, 128, .5); outline: none;
  opacity: 0; transform: translateY(24px) scale(.96); transition: opacity .3s, transform .35s cubic-bezier(.2,.9,.3,1.2);
}
.modal.is-open .modal__backdrop { opacity: 1; }
.modal.is-open .modal__dialog { opacity: 1; transform: none; }
.modal__x { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--lav-100); color: var(--lav-600); font-size: 22px; cursor: pointer; line-height: 1; }
.modal__art { font-size: 44px; margin-bottom: 6px; }
.modal h3 { font-size: 23px; margin: 14px 0 8px; line-height: 1.35; }
.modal p { color: var(--ink-soft); font-size: 15px; margin: 0 0 14px; }
.modal__list { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; }
.modal__list li { font-size: 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.modal__list li::before { content: "✿ "; color: var(--pink-400); }
.modal__deadline { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; font-size: 14px !important; }
.modal__cta { width: 100%; }
.modal__foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
.modal__foot .agree { align-items: center; color: var(--ink-soft); }
.modal__foot .agree input { margin: 0; width: 18px; height: 18px; }
.modal__foot .link-btn { color: var(--ink-soft); }

/* 토스트 · 폭죽 */
.toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 120; display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); pointer-events: none; }
.toast {
  padding: 13px 18px; border-radius: 16px; background: rgba(61, 44, 69, .92); color: #fff; font-size: 14px; font-weight: 500; text-align: center;
  box-shadow: 0 14px 30px -12px rgba(0,0,0,.4); opacity: 0; transform: translateY(14px); transition: opacity .3s, transform .3s;
}
.toast.is-in { opacity: 1; transform: none; }
.toast.is-error { background: #c0446f; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 110; }

@media (max-width: 960px) {
  .participate-grid { grid-template-columns: 1fr; }
}
@media (max-width: 900px) and (min-width: 821px) {
  .nav a { padding: 8px 10px; font-size: 14px; }
}
@media (max-width: 640px) {
  .apply-card { padding: 22px 18px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-actions .btn { width: 100%; }
  .att li { flex-wrap: wrap; }
  .subs li { flex-wrap: wrap; }
  .subs__file { order: 3; flex-basis: 100%; }
  .modal__dialog { padding: 30px 20px 16px; border-radius: 24px; }
  .modal h3 { font-size: 20px; }
}

/* =====================================================================
 *  5단계: 공지 · 관리자 모드
 * ===================================================================== */
/* 자물쇠 버튼 */
.admin-lock {
  flex: none; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer;
  display: grid; place-items: center; background: rgba(255,255,255,.7); color: var(--ink-soft); transition: all .2s;
}
.admin-lock:hover { color: var(--lav-600); background: var(--lav-100); }
.admin-lock.is-unlocked { color: #fff; background: var(--grad); border-color: transparent; }
.nav { margin-left: auto; }

/* 공지 */
.section--notice { padding-top: 28px; }
.notice-board { padding: 22px 24px; }
.notice-board:hover { transform: none; }
.notice-board__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.notice-board__head h2 { margin: 0; font-size: 20px; }
.notice-board__head span { font-size: 13px; color: var(--ink-soft); }
.notice-list { display: grid; gap: 8px; }
.notice { border-radius: 14px; background: #fff; border: 1px solid var(--line); }
.notice.is-important { border-color: var(--pink-200); background: linear-gradient(90deg, #fff6fa, #fff); }
.notice.is-more { display: none; }
.show-all .notice.is-more { display: block; }
.notice summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
.notice summary::-webkit-details-marker { display: none; }
.notice__title { flex: 1; font-weight: 700; font-size: 15px; min-width: 0; }
.notice__new { font-size: 10px; font-weight: 800; color: #fff; background: var(--pink-500); width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.notice time { font-size: 13px; color: var(--ink-soft); flex: none; }
.notice p { margin: 0 !important; padding: 0 16px 14px; font-size: 14px; color: var(--ink-soft); }
.notice-more { margin-top: 10px; }

/* 관리자 화면 */
.admin { position: fixed; inset: 0; z-index: 90; background: #fbf8ff; display: flex; flex-direction: column; opacity: 0; transition: opacity .25s; }
.admin.is-open { opacity: 1; }
.admin__bar {
  display: flex; align-items: center; gap: 12px; padding: 12px 20px; flex-wrap: wrap;
  background: linear-gradient(135deg, #6a4a9e, var(--lav-800)); color: #fff;
}
.admin__bar .link-btn { color: #ffe4ef; }
.admin__bar .btn--ghost { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.3); }
.admin__mode { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.16); }
.admin__mode.is-remote { background: #2f8a5b; }
.admin__spacer { flex: 1; }
.admin__close { width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: #fff; font-size: 22px; cursor: pointer; }
.admin__wrap { flex: 1; display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
.admin__tabs { padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line); background: #fff; overflow: auto; }
.admin__tabs button {
  display: flex; align-items: center; gap: 10px; text-align: left; font: inherit; font-size: 15px; font-weight: 500;
  padding: 11px 14px; border-radius: 12px; border: 0; background: none; color: var(--ink-soft); cursor: pointer; white-space: nowrap;
}
.admin__tabs button:hover { background: var(--pink-50); }
.admin__tabs button[aria-selected="true"] { background: var(--grad); color: #fff; }
.admin__main { overflow: auto; padding: 28px 32px 60px; }
.admin__h { margin: 0 0 6px; font-size: 24px; }
.admin__hint { font-size: 14px; color: var(--ink-soft); margin: 0 0 14px; }
.admin__card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 22px; margin-top: 18px; box-shadow: 0 6px 20px -16px rgba(123,92,201,.5); }
.admin__card h3 { margin: 0 0 12px; font-size: 17px; }
.admin__card h3 small, .tbl-top small { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.admin__card--danger { border-color: #f3a9c5; }
.admin__grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.admin__alert { margin-top: 14px; padding: 12px 16px; border-radius: 14px; background: #fff6e5; border: 1px solid #f5d79a; font-size: 14px; }
.admin__alert--info { background: var(--lav-100); border-color: var(--lav-200); }
.admin__loading { display: flex; gap: 10px; align-items: center; color: var(--ink-soft); padding: 40px 0; }
.spinner--dark { border-color: var(--lav-200); border-top-color: var(--lav-600); }
.admin__stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
.admin__stat {
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; text-align: left;
  padding: 18px; border-radius: 18px; background: #fff; border: 1px solid var(--line); font: inherit; color: var(--ink); cursor: pointer; transition: transform .2s, border-color .2s;
}
.admin__stat:not(:disabled):hover { transform: translateY(-2px); border-color: var(--pink-400); }
.admin__stat:disabled { cursor: default; }
.admin__stat > span { grid-row: span 3; font-size: 26px; width: 50px; height: 50px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(135deg, var(--pink-100), var(--lav-100)); }
.admin__stat small { font-size: 13px; color: var(--ink-soft); }
.admin__stat b { font-size: 24px; }
.admin__stat em { font-style: normal; font-size: 12px; color: var(--lav-600); font-weight: 700; }
.admin__quick { display: flex; gap: 8px; flex-wrap: wrap; }

/* 콘텐츠 편집기 */
.ed { display: grid; grid-template-columns: 190px 1fr; gap: 18px; margin-top: 16px; align-items: start; }
.ed__nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; }
.ed__nav button { text-align: left; font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 10px; border: 0; background: none; color: var(--ink-soft); cursor: pointer; }
.ed__nav button:hover { background: var(--pink-50); }
.ed__nav button.is-on { background: var(--lav-100); color: var(--lav-600); font-weight: 700; }
.ed__select { display: none; }
.ed__body { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 20px; min-width: 0; }
.ed__actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; margin-top: 16px; }
.ed__body > .ed__actions { position: sticky; bottom: -60px; background: #fff; padding: 12px 0 4px; border-top: 1px solid var(--line); }
.ed__dirty { font-size: 13px; color: var(--pink-500); font-weight: 700; margin-right: auto; }
.ed-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.ed-field > span, .ed-arr__head, .ed-obj legend { font-size: 13px; font-weight: 700; color: var(--ink); }
.ed-field code, .ed-arr__head code, .ed-obj legend code, .ed-item summary code { font-size: 11px; color: var(--lav-400); font-weight: 500; margin-left: 4px; }
.ed input[type=text], .ed input[type=number], .ed textarea, .admin input:not([type=checkbox]):not([type=file]), .admin textarea, .admin select {
  font: inherit; font-size: 14px; color: var(--ink); width: 100%; padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--lav-200); background: #fff;
}
.admin input:focus, .admin textarea:focus, .admin select:focus { outline: none; border-color: var(--lav-400); box-shadow: 0 0 0 3px rgba(169,139,232,.18); }
.ed textarea, .admin textarea { resize: vertical; }
.ed-obj { border: 1px dashed var(--lav-200); border-radius: 14px; padding: 12px 14px 2px; margin: 0 0 12px; }
.ed-arr { margin-bottom: 14px; }
.ed-arr__head { margin-bottom: 6px; }
.ed-count { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
.ed-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.ed-item { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; background: var(--pink-50); }
.ed-item summary { cursor: pointer; padding: 10px 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; list-style: none; }
.ed-item summary::-webkit-details-marker { display: none; }
.ed-item summary > b { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: var(--grad); color: #fff; font-size: 12px; flex: none; }
.ed-item__body { padding: 4px 14px 6px; background: #fff; border-top: 1px solid var(--line); border-radius: 0 0 14px 14px; }
.ed-tools { display: inline-flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.ed-tools button, .tbl-del {
  font: inherit; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: #fff; color: var(--lav-600); cursor: pointer; white-space: nowrap;
}
.ed-tools button:hover:not(:disabled), .tbl-del:hover { background: var(--lav-100); }
.ed-tools button:disabled { opacity: .35; cursor: default; }
.ed-tools button.is-primary { background: var(--grad); color: #fff; border-color: transparent; }
.ed-add { font: inherit; font-size: 13px; font-weight: 700; color: var(--pink-500); background: none; border: 1.5px dashed var(--pink-200); border-radius: 12px; padding: 8px; width: 100%; cursor: pointer; }
.ed-add:hover { background: var(--pink-50); }
.ed-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.ed-switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.ed-switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--lav-200); transition: background .2s; }
.ed-switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
.ed-switch input:checked + i { background: var(--pink-500); }
.ed-switch input:checked + i::after { transform: translateX(20px); }

/* 공지 폼 · 목록 */
.nform__row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.nform__row .ed-field { margin: 0; }
.nlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.nlist li { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); }
.nlist li > div { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.nlist small { color: var(--ink-soft); font-size: 12px; }

/* 표 */
.tbl-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.tbl-top h3 { margin: 0 !important; }
.tbl-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 14px; max-height: 60vh; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { position: sticky; top: 0; background: var(--lav-100); color: var(--lav-800); text-align: left; padding: 10px 12px; white-space: nowrap; font-weight: 700; }
.tbl td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: middle; max-width: 260px; }
.tbl tbody tr:nth-child(even) td { background: #fdfbff; }
.tbl-empty { text-align: center; padding: 28px !important; }
.tbl--edit td { padding: 6px 8px; }
.tbl--edit input { padding: 7px 10px !important; }
.seg { display: inline-flex; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin-top: 12px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 14px; font-weight: 500; padding: 8px 14px; border: 0; border-radius: 10px; background: none; color: var(--ink-soft); cursor: pointer; }
.seg button.is-on { background: var(--grad); color: #fff; }
.seg small { font-weight: 700; margin-left: 2px; }
.file-btn { cursor: pointer; }
.pwform { display: grid; gap: 8px; margin-bottom: 10px; }
.pwform .btn { justify-self: start; }
.admin-login input { font: inherit; width: 100%; padding: 13px 14px; border-radius: 14px; border: 1.5px solid var(--lav-200); margin-bottom: 6px; }
.admin-login input:focus { outline: none; border-color: var(--lav-400); box-shadow: 0 0 0 4px rgba(169,139,232,.18); }
.admin-login .field__err { text-align: left; margin-bottom: 10px; }

@media (max-width: 900px) {
  .admin__wrap { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .admin__tabs { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
  .admin__tabs button { padding: 8px 12px; font-size: 14px; }
  .admin__stats { grid-template-columns: repeat(2, 1fr); }
  .admin__grid2 { grid-template-columns: 1fr; }
  .ed { grid-template-columns: 1fr; }
  .ed__nav { display: none; }
  .ed__select { display: block; margin-bottom: 14px; font-weight: 700 !important; }
}
@media (max-width: 820px) {
  .admin-lock { order: 2; margin-left: auto; }
  .menu-toggle { order: 3; }
  .header__inner { gap: 10px; }
}
@media (max-width: 640px) {
  .admin__bar { padding: 10px 14px; gap: 8px; }
  .admin__bar .link-btn { display: none; }
  .admin__main { padding: 18px 14px 60px; }
  .admin__stats { grid-template-columns: 1fr 1fr; gap: 10px; }
  .admin__stat { padding: 14px; column-gap: 10px; }
  .admin__stat > span { width: 40px; height: 40px; font-size: 20px; }
  .admin__stat b { font-size: 20px; }
  .admin__card { padding: 16px; }
  .ed__body { padding: 14px; }
  .notice summary { flex-wrap: wrap; }
  .notice time { width: 100%; font-size: 12px; }
}
.ed-tools button.is-primary:hover:not(:disabled) { background: var(--grad); filter: brightness(1.05); }

/* ===== 마무리 점검: 터치 영역 보정 ===== */
.slider__dots { gap: 0; }
.slider__dots button, .slider__dots button.is-active { width: 28px; height: 28px; background: none; position: relative; border-radius: 50%; }
.slider__dots button::before {
  content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 10px; height: 10px; border-radius: 999px; background: var(--lav-200); transition: width .25s, background .25s;
}
.slider__dots button.is-active { width: 40px; }
.slider__dots button.is-active::before { width: 28px; background: var(--grad); }
.link-btn { padding: 6px 4px; min-height: 32px; }

/* =====================================================================
 *  실시간 퀴즈 (학생 참여 · 교수자 진행)
 * ===================================================================== */
:root { --q0: #d9466f; --q1: #6c5ad6; --q2: #cf7f12; --q3: #2e9e7e; }
.qt--0 { --qc: var(--q0); } .qt--1 { --qc: var(--q1); } .qt--2 { --qc: var(--q2); } .qt--3 { --qc: var(--q3); }

/* 섹션 카드 */
.quiz-card { margin-top: 20px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; align-items: center;
  background: radial-gradient(400px 220px at 0% 0%, rgba(240,139,180,.18), transparent 70%), radial-gradient(400px 220px at 100% 100%, rgba(169,139,232,.2), transparent 70%), var(--card); }
.quiz-card:hover { transform: none; }
.quiz-card h3 { font-size: 24px; margin-bottom: 4px; }
.quiz-steps { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 8px; }
.quiz-steps li { font-size: 14px; color: var(--ink-soft); background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
.quiz-steps b { color: var(--ink); margin-right: 6px; }
.quiz-join { display: grid; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 22px; }
.quiz-join input { font: inherit; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--lav-200); }
.quiz-join input:focus { outline: none; border-color: var(--lav-400); box-shadow: 0 0 0 4px rgba(169,139,232,.18); }
.quiz-join__pin { font-size: 30px !important; font-weight: 800; letter-spacing: .3em; text-align: center; font-variant-numeric: tabular-nums; }
.quiz-join .btn { margin-top: 6px; }

/* 보기 타일 공통 */
.qt { display: flex; align-items: center; gap: 12px; border: 0; border-radius: 16px; padding: 16px 18px; color: #fff; background: var(--qc);
  font: inherit; font-weight: 700; text-align: left; box-shadow: 0 6px 0 rgba(0,0,0,.14); min-height: 64px; }
.qt b { font-size: 22px; width: 30px; text-align: center; flex: none; }
.qt span { min-width: 0; overflow-wrap: anywhere; }

/* 학생 풀이 화면 */
.qp { position: fixed; inset: 0; z-index: 95; display: flex; flex-direction: column; opacity: 0; transition: opacity .25s;
  background: radial-gradient(600px 400px at 0% 0%, var(--pink-100), transparent 70%), radial-gradient(600px 400px at 100% 100%, var(--lav-100), transparent 70%), #fdf9ff; }
.qp.is-open { opacity: 1; }
.qp__bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(255,255,255,.85); border-bottom: 1px solid var(--line); }
.qp__pin { font-size: 12px; font-weight: 700; color: var(--lav-600); background: var(--lav-100); padding: 3px 10px; border-radius: 999px; }
.qp__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qp__score { font-weight: 800; color: #fff; background: var(--grad); padding: 4px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.qp__x { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--lav-100); color: var(--lav-600); font-size: 22px; cursor: pointer; }
.qp__stage { flex: 1; overflow: auto; display: flex; padding: 18px; }
.qp__center { margin: auto; text-align: center; max-width: 520px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.qp__center h3 { margin: 0; font-size: 26px; }
.qp__center p { margin: 0; color: var(--ink-soft); }
.qp__big { font-size: 64px; line-height: 1; }
.qp__title { font-size: 13px !important; margin-top: 10px !important; }
.pulse-heart { animation: beat 1.4s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.qp__q { width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; position: relative; }
.qp__qn { align-self: center; font-size: 13px; font-weight: 800; color: var(--lav-600); background: var(--lav-100); padding: 3px 12px; border-radius: 999px; }
.qp__text { margin: 0; font-size: clamp(19px, 4.6vw, 26px); text-align: center; line-height: 1.45; }
.qp__timer { width: 100%; height: 10px; border-radius: 999px; background: var(--lav-100); overflow: hidden; }
.qp__timer i { display: block; height: 100%; width: 100%; background: var(--grad); border-radius: inherit; transition: width .2s linear; }
.qp__timer i.is-low { background: var(--q0); }
.qp__center .qp__timer { max-width: 280px; }
.qp__opts { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.qp__opts .qt { min-height: 96px; font-size: 17px; cursor: pointer; flex-direction: column; justify-content: center; text-align: center; gap: 6px; transition: transform .1s, opacity .2s; }
.qp__opts--2 .qt { min-height: 150px; }
.qp__opts--2 .qt b { font-size: 46px; width: auto; }
.qp__opts .qt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.14); }
.qp__opts .qt:disabled { opacity: .55; cursor: default; }
.qp__opts .qt.is-picked { opacity: 1; outline: 4px solid #fff; box-shadow: 0 0 0 7px var(--qc); }
.qp__ready { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 20px;
  background: rgba(253,249,255,.92); backdrop-filter: blur(3px); }
.qp__ready[hidden] { display: none; }
.qp__ready b { font-size: 84px; line-height: 1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.qp__ready span { font-weight: 800; color: var(--lav-600); }
.qt-big { width: 110px; height: 110px; border-radius: 28px; display: grid; place-items: center; font-size: 54px; color: #fff; background: var(--qc); box-shadow: 0 8px 0 rgba(0,0,0,.14); }
.qp__result.is-ok h3 { color: var(--q3); }
.qp__result.is-no h3 { color: var(--q0); }
.qp__plus { font-size: 30px !important; font-weight: 800; color: var(--q3) !important; }
.qp__plus.pop { animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.qp__explain { font-size: 14px !important; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; text-align: left; }
.qp__rank { display: flex; align-items: baseline; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 20px; margin-top: 4px; }
.qp__rank b { font-size: 28px; color: var(--lav-600); }
.qp__rank span { font-weight: 700; }
.qp__rank--final b { font-size: 44px; }
.qp__lb { list-style: none; margin: 6px 0 0; padding: 0; width: 100%; display: grid; gap: 6px; }
.qp__lb li { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; text-align: left; font-size: 15px; }
.qp__lb li span { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--lav-100); color: var(--lav-600); font-weight: 800; font-size: 13px; flex: none; }
.qp__lb li b { margin-left: auto; font-variant-numeric: tabular-nums; }
.qp__lb li.is-me { border-color: var(--pink-400); background: var(--pink-50); }

/* 교수자 진행 화면 */
.qh { position: fixed; inset: 0; z-index: 92; display: flex; flex-direction: column; background: #fbf8ff; opacity: 0; transition: opacity .25s; }
.qh.is-open { opacity: 1; }
.qh__bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: #fff; background: linear-gradient(135deg, #6a4a9e, var(--lav-800)); flex-wrap: wrap; }
.qh__pinbar { font-size: 15px; } .qh__pinbar b { font-size: 20px; letter-spacing: .08em; margin-left: 4px; }
.qh__main { flex: 1; overflow: auto; padding: 24px; }
.qh-modal { z-index: 130; }

/* 만들기 */
.qs { display: grid; grid-template-columns: 240px 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; align-items: start; }
.qs__sets { display: grid; gap: 6px; position: sticky; top: 0; }
.qs__sets h3 { margin: 0 0 4px; font-size: 15px; color: var(--ink-soft); }
.qs__set { text-align: left; font: inherit; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.qs__set small { color: var(--ink-soft); font-size: 12px; }
.qs__set.is-on { border-color: transparent; background: var(--grad); color: #fff; }
.qs__set.is-on small { color: rgba(255,255,255,.85); }
.qs__edit { min-width: 0; }
.qs__head { display: flex; gap: 10px; align-items: center; }
.qs__title { flex: 1; font: inherit; font-size: 22px; font-weight: 800; padding: 8px 12px; border-radius: 12px; border: 1.5px solid transparent; background: transparent; min-width: 0; }
.qs__title:hover, .qs__title:focus { border-color: var(--lav-200); background: #fff; outline: none; }
.qs__actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0 4px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 16px; position: sticky; top: -24px; z-index: 2; }
.qs__actions .ed__dirty { margin-left: auto; }
.qs__actions .btn--primary { margin-left: auto; }
.qs__actions .ed__dirty:not([hidden]) + .btn { margin-left: 0; }
.qs__list { display: grid; gap: 12px; margin-top: 10px; }
.qs__empty { text-align: center; padding: 40px 20px; background: #fff; border: 1.5px dashed var(--lav-200); border-radius: 18px; color: var(--ink-soft); }
.qe { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px; }
.qe__head { display: flex; gap: 8px; align-items: center; }
.qe__num { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--grad); color: #fff; font-weight: 800; flex: none; }
.qe select, .qe textarea, .qe input:not([type=radio]), .qai input:not([type=checkbox]), .qai select, .qai textarea {

(function () {
  "use strict";
  // 관리자 화면에서 고친 설정이 이 브라우저에 저장되어 있으면 그것을 먼저 적용
  try {

    const fileStamp = window.SITE_CONFIG && window.SITE_CONFIG.__savedAt;
    if (saved && saved.config && fileStamp && saved.savedAt <= fileStamp) localStorage.removeItem("ab26.configOverride");   // 파일이 더 최신이면 브라우저 수정본은 버림

  const C = window.SITE_CONFIG;

  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
