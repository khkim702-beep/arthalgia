<script id="gs-src" type="text/plain" data-bundle="1">
/* =====================================================================
 *  관절염 생체역학 강의 사이트 — 운영 모드 백엔드 (Google Apps Script)
 *  ---------------------------------------------------------------------
 *  투표·회원가입·로그인·출석·과제 제출 데이터를 교수자의 구글 스프레드시트와
 *  구글 드라이브에 저장합니다. 별도 서버가 필요 없습니다.
 *
 *  [설치 방법]
 *  1. 구글 드라이브에서 새 스프레드시트를 만듭니다. (예: "관절염 생체역학 운영")
 *  2. 메뉴 [확장 프로그램] → [Apps Script] 를 열고, 이 파일 내용을 전부 붙여 넣고 저장합니다.
 *  3. 위쪽 함수 선택에서 setup 을 고르고 [실행] → 권한 허용.
 *     → 시트 8개(투표, 회원가입, 학생, 출석, 과제제출, 출석코드, 공지, 퀴즈결과)와 과제 보관용 드라이브 폴더가 만들어집니다.
 *  4. '학생' 시트에 수강생의 아이디 / 이름 / 비밀번호를 한 줄씩 입력합니다.
 *     (수강 신청서를 받은 뒤 확정된 학생만 넣고, 비밀번호는 생년월일 4자리 등으로 정해 개별 안내)
 *  5. [배포] → [새 배포] → 유형: 웹 앱
 *     - 다음 사용자로 실행: 나(교수자)
 *     - 액세스 권한: 모든 사용자
 *     → 발급된 웹 앱 URL(https://script.google.com/macros/s/.../exec)을 복사합니다.
 *  6. 사이트 관리자 화면 → 콘텐츠 편집 → '데이터 저장(운영 모드)' → url 에 붙여 넣고 저장하면 운영 모드로 바뀝니다.
 *     (설정 저장에서 index.html 을 내려받아 교체해야 학생들에게도 적용됩니다)
 *  ※ 코드를 고친 뒤에는 [배포] → [배포 관리] → 편집 → 새 버전으로 다시 배포해야 반영됩니다.
 *
 *  [관리자] 아래 ADMIN_KEY 를 사이트 관리자 비밀번호와 같게 정해 두면, 사이트의 관리자 화면에서
 *   수강생 명단 저장 · 공지 게시 · 신청/출석/과제 기록 조회가 이 스프레드시트와 연결됩니다.
 *
 *  [출석 관리] '출석코드' 시트
 *   주차(1,2,3) | 코드 | 출석가능(TRUE/FALSE)
 *   - 출석가능을 FALSE 로 두면 그 주차 출석이 막힙니다. (수업이 끝나면 FALSE 로 바꾸세요)
 *   - 코드를 적어 두면 학생이 같은 코드를 입력해야 출석됩니다. (사이트 관리자 → 콘텐츠 편집 → 내 강의실 → 출석 코드 사용)
 *   - 해당 주차 줄이 없으면 제한 없이 출석할 수 있습니다.
 * ===================================================================== */

/* ▼ 관리자 비밀번호 — Apps Script 편집기에 붙여 넣은 뒤, 사이트 관리자 화면 비밀번호와 똑같이 적어 주세요.
 *   (Apps Script 코드는 교수자만 볼 수 있습니다. 사이트 폴더에 있는 이 파일에는 비밀번호를 적지 마세요) */
const ADMIN_KEY = "";

const SHEET = { poll: "투표", apply: "회원가입", students: "학생", att: "출석", subs: "과제제출", codes: "출석코드", notices: "공지" };
const HEADERS = {
  "투표": ["항목ID", "득표수"],
  "회원가입": ["제출시각"],
  "학생": ["아이디", "이름", "비밀번호"],
  "출석": ["시각", "아이디", "이름", "주차"],
  "과제제출": ["시각", "아이디", "이름", "주차", "파일명", "크기(byte)", "지각여부", "파일 링크"],
  "출석코드": ["주차", "코드", "출석가능"],
  "공지": ["id", "게시일", "중요", "제목", "내용", "고정", "수정일", "팝업", "팝업종료일"],
  "퀴즈결과": ["저장시각", "퀴즈", "PIN", "순위", "이름", "아이디", "총점", "정답 수", "문항 수", "문항별 정오"]
};
const FOLDER_NAME = "관절염생체역학_과제제출";

function setup() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  Object.keys(HEADERS).forEach(function (name) {
    let sh = ss.getSheetByName(name);
    if (!sh) sh = ss.insertSheet(name);
    if (sh.getLastRow() === 0) sh.appendRow(HEADERS[name]);
    sh.setFrozenRows(1);
  });
  folder_();
  Logger.log("설정 완료! 이제 [배포] → [새 배포] → 웹 앱으로 배포하세요.");
}

/* ---------- 진입점 ---------- */
function doGet(e) {
  return run_(function () {
    const action = e.parameter.action;
    if (action === "poll") return { counts: pollCounts_() };
    if (action === "notices") return { notices: notices_() };
    if (action === "quizState") return quizState_(String(e.parameter.pin || ""), String(e.parameter.pid || ""));
    throw new Error("알 수 없는 요청입니다.");
  });
}

function doPost(e) {
  return run_(function () {
    const b = JSON.parse(e.postData.contents || "{}");
    switch (b.action) {
      case "vote":   return { counts: vote_(b.option, b.prev) };
      case "apply":  return apply_(b.data || {}, b.account);
      case "login":  return { name: auth_(b.id, b.pin).name };
      case "status": return status_(auth_(b.id, b.pin));
      case "attend": return attend_(auth_(b.id, b.pin), Number(b.week), b.code);
      case "submit": return submit_(auth_(b.id, b.pin), b);
      case "adminDump":        admin_(b.key); return adminDump_();
      case "adminSetStudents": admin_(b.key); return adminSetStudents_(b.students || []);
      case "adminSaveNotices": admin_(b.key); return adminSaveNotices_(b.notices || []);
      case "quizJoin":   return quizJoin_(String(b.pin || ""), b.name, b.sid);
      case "quizAnswer": return quizAnswer_(String(b.pin || ""), String(b.pid || ""), Number(b.q), Number(b.choice));
      case "quizCreate": admin_(b.key); return quizCreate_(b.quiz);
      case "quizHost":   admin_(b.key); return quizHost_(String(b.pin || ""), String(b.cmd || "snapshot"));
      case "quizSave":   admin_(b.key); return quizSave_(b.rows || []);
    }
    throw new Error("알 수 없는 요청입니다.");
  });
}

function run_(fn) {
  let out;
  try { out = Object.assign({ ok: true }, fn()); }
  catch (err) { out = { ok: false, error: String(err.message || err) }; }
  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
}

/* ---------- 도우미 ---------- */
function sheet_(name) {
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(name);
  if (!sh) throw new Error("'" + name + "' 시트가 없습니다. setup 을 먼저 실행하세요.");
  return sh;
}
function rows_(name) {
  const v = sheet_(name).getDataRange().getValues();
  return v.slice(1);
}
function withLock_(fn) {
  const lock = LockService.getScriptLock();
  lock.waitLock(10000);
  try { return fn(); } finally { lock.releaseLock(); }
}
function folder_() {
  const props = PropertiesService.getScriptProperties();
  const id = props.getProperty("FOLDER_ID");
  if (id) { try { return DriveApp.getFolderById(id); } catch (e) {} }
  const f = DriveApp.createFolder(FOLDER_NAME);
  props.setProperty("FOLDER_ID", f.getId());
  return f;
}

/* ---------- 투표 ---------- */
function pollCounts_() {
  const c = {};
  rows_(SHEET.poll).forEach(function (r) { if (r[0]) c[String(r[0])] = Number(r[1]) || 0; });
  return c;
}
function vote_(option, prev) {
  if (!option || !/^[\w-]{1,40}$/.test(option)) throw new Error("잘못된 투표 항목입니다.");
  return withLock_(function () {
    const sh = sheet_(SHEET.poll), v = sh.getDataRange().getValues();
    function bump(id, d) {
      for (let i = 1; i < v.length; i++) if (String(v[i][0]) === id) {
        const n = Math.max(0, (Number(v[i][1]) || 0) + d);
        sh.getRange(i + 1, 2).setValue(n); v[i][1] = n; return;
      }
      if (d > 0) { sh.appendRow([id, d]); v.push([id, d]); }
    }
    if (prev && prev !== option) bump(String(prev), -1);
    bump(String(option), 1);
    return pollCounts_();
  });
}

/* ---------- 수강 신청 ---------- */
function apply_(data, account) {
  return withLock_(function () {
    // 회원가입: 아이디가 이미 '학생' 시트에 있으면 가입 거부, 없으면 계정 추가
    if (account && account.id) {
      const exists = rows_(SHEET.students).some(function (r) { return String(r[0]).trim().toLowerCase() === String(account.id).trim().toLowerCase(); });
      if (exists) throw new Error("이미 사용 중인 아이디입니다. 다른 아이디를 입력해 주세요.");
      if (!account.pin || String(account.pin).length < 4) throw new Error("비밀번호는 4자 이상이어야 합니다.");
    }
    const sh = sheet_(SHEET.apply);
    const keys = Object.keys(data);
    let header = sh.getRange(1, 1, 1, Math.max(1, sh.getLastColumn())).getValues()[0];
    keys.forEach(function (k) { if (header.indexOf(k) < 0) { header.push(k); } });
    sh.getRange(1, 1, 1, header.length).setValues([header]);
    const sidCol = header.indexOf("sid");
    if (sidCol >= 0 && data.sid) {
      const dup = rows_(SHEET.apply).some(function (r) { return String(r[sidCol]) === String(data.sid); });
      if (dup) throw new Error("이미 가입한 학번입니다.");
    }
    const row = header.map(function (h, i) { return i === 0 ? new Date() : (data[h] != null ? String(data[h]).slice(0, 2000) : ""); });
    sh.appendRow(row);
    if (account && account.id) {
      const st = sheet_(SHEET.students), r = st.getLastRow() + 1;
      st.getRange(r, 1, 1, 3).setNumberFormat("@").setValues([[String(account.id), String(account.name || data.name || ""), String(account.pin)]]);
    }
    return {};
  });
}

/* ---------- 로그인 ---------- */
function auth_(id, pin) {
  id = String(id || "").trim(); pin = String(pin || "").trim();
  const r = rows_(SHEET.students).find(function (r) { return String(r[0]).trim().toLowerCase() === id.toLowerCase() && String(r[2]).trim() === pin; });
  if (!r) throw new Error("아이디 또는 비밀번호가 올바르지 않습니다.");
  return { id: id, name: String(r[1]) };
}

/* ---------- 출석 · 과제 현황 ---------- */
function status_(u) {
  const attendance = {};
  rows_(SHEET.att).forEach(function (r) {
    if (String(r[1]) === u.id) attendance[Number(r[3]) - 1] = new Date(r[0]).toISOString();
  });
  const submissions = rows_(SHEET.subs).filter(function (r) { return String(r[1]) === u.id; }).map(function (r) {
    return { at: new Date(r[0]).toISOString(), week: Number(r[3]) - 1, fileName: String(r[4]), size: Number(r[5]), late: r[6] === "지각" };
  });
  return { attendance: attendance, submissions: submissions };
}

function attend_(u, week, code) {
  if (!(week >= 0)) throw new Error("주차 정보가 올바르지 않습니다.");
  const rule = rows_(SHEET.codes).find(function (r) { return Number(r[0]) === week + 1; });
  if (rule) {
    if (rule[2] === false || String(rule[2]).toUpperCase() === "FALSE") throw new Error("지금은 출석 시간이 아닙니다.");
    if (String(rule[1]).trim() && String(rule[1]).trim() !== String(code || "").trim()) throw new Error("출석 코드가 올바르지 않습니다.");
  }
  return withLock_(function () {
    const done = rows_(SHEET.att).some(function (r) { return String(r[1]) === u.id && Number(r[3]) === week + 1; });
    if (done) throw new Error("이미 출석 체크했습니다.");
    sheet_(SHEET.att).appendRow([new Date(), u.id, u.name, week + 1]);
    return {};
  });
}

function submit_(u, b) {
  const week = Number(b.week);
  if (!(week >= 0)) throw new Error("과제 정보가 올바르지 않습니다.");
  if (!b.data) throw new Error("파일이 비어 있습니다.");
  const bytes = Utilities.base64Decode(b.data);
  if (bytes.length > 20 * 1024 * 1024) throw new Error("파일이 너무 큽니다.");
  const now = new Date();
  const late = b.due && now > new Date(b.due) ? "지각" : "정상";
  const safeName = String(b.fileName || "file").replace(/[\\/:*?"<>|]/g, "_");
  const root = folder_();
  const sub = root.getFoldersByName((week + 1) + "주차").hasNext() ? root.getFoldersByName((week + 1) + "주차").next() : root.createFolder((week + 1) + "주차");
  const file = sub.createFile(Utilities.newBlob(bytes, b.mimeType || "application/octet-stream", u.id + "_" + u.name + "_" + safeName));
  sheet_(SHEET.subs).appendRow([now, u.id, u.name, week + 1, safeName, bytes.length, late, file.getUrl()]);
  return {};
}

/* ---------- 공지 ---------- */
function notices_() {
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEET.notices);
  if (!sh) return [];
  return sh.getDataRange().getValues().slice(1).filter(function (r) { return r[0]; }).map(function (r) {
    const d = r[1] instanceof Date ? Utilities.formatDate(r[1], Session.getScriptTimeZone(), "yyyy-MM-dd") : String(r[1]);
    const yes = function (v) { return v === true || String(v).toUpperCase() === "TRUE"; };
    const up = r[6] instanceof Date ? Utilities.formatDate(r[6], Session.getScriptTimeZone(), "yyyy-MM-dd") : String(r[6] || "");
    const pu = r[8] instanceof Date ? Utilities.formatDate(r[8], Session.getScriptTimeZone(), "yyyy-MM-dd") : String(r[8] || "");
    return { id: String(r[0]), date: d, important: yes(r[2]), title: String(r[3]), body: String(r[4]), pinned: yes(r[5]), updated: up, popup: yes(r[7]), popupUntil: pu };
  });
}

/* ---------- 관리자 기능 ---------- */
function admin_(key) {
  if (!ADMIN_KEY) throw new Error("Apps Script 의 ADMIN_KEY 가 비어 있습니다. 관리자 비밀번호를 적고 다시 배포하세요.");
  if (!key || String(key) !== ADMIN_KEY) throw new Error("관리자 인증에 실패했습니다. Apps Script 의 ADMIN_KEY 를 확인하세요.");
}
function objects_(name) {
  const v = sheet_(name).getDataRange().getValues();
  const h = v[0];
  return v.slice(1).map(function (r) { const o = {}; h.forEach(function (k, i) { o[k] = r[i] instanceof Date ? r[i].toISOString() : r[i]; }); return o; });
}
function adminDump_() {
  const apps = objects_(SHEET.apply).map(function (o) { o.at = o["제출시각"]; return o; });
  const att = rows_(SHEET.att).map(function (r) { return { at: new Date(r[0]).toISOString(), id: String(r[1]), name: String(r[2]), week: Number(r[3]) - 1 }; });
  const subs = rows_(SHEET.subs).map(function (r) {
    return { at: new Date(r[0]).toISOString(), id: String(r[1]), name: String(r[2]), week: Number(r[3]) - 1, fileName: String(r[4]), size: Number(r[5]), late: r[6] === "지각", url: String(r[7] || "") };
  });
  const students = rows_(SHEET.students).filter(function (r) { return r[0]; }).map(function (r) { return { id: String(r[0]), name: String(r[1]), pin: String(r[2]) }; });
  return { applications: apps, attendance: att, submissions: subs, students: students, poll: pollCounts_() };
}
function adminSetStudents_(list) {
  return withLock_(function () {
    const sh = sheet_(SHEET.students);
    if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 3).clearContent();
    const rows = list.map(function (s) { return [String(s.id), String(s.name), String(s.pin)]; });
    if (rows.length) { sh.getRange(2, 1, rows.length, 3).setNumberFormat("@").setValues(rows); }
    return { count: rows.length };
  });
}
function adminSaveNotices_(list) {
  return withLock_(function () {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    let sh = ss.getSheetByName(SHEET.notices);
    if (!sh) { sh = ss.insertSheet(SHEET.notices); sh.appendRow(HEADERS["공지"]); }
    sh.getRange(1, 1, 1, 9).setValues([HEADERS["공지"]]);
    if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 9).clearContent();
    const rows = list.map(function (n) { return [String(n.id), String(n.date), !!n.important, String(n.title).slice(0, 200), String(n.body).slice(0, 5000), !!n.pinned, String(n.updated || ""), !!n.popup, String(n.popupUntil || "")]; });
    if (rows.length) sh.getRange(2, 1, rows.length, 9).setValues(rows);
    return {};
  });
}

/* =====================================================================
 *  실시간 퀴즈 — 진행 중 데이터는 빠른 임시 저장소(CacheService, 6시간)에 두고,
 *  교수자가 '구글 시트에 저장'을 누르면 '퀴즈결과' 시트에 기록합니다.
 *  ※ 학생 화면이 1.5초마다 상태를 확인합니다. 한 번에 40명 안팎까지 원활합니다.
 * ===================================================================== */
const QZ_TTL = 21600;
function qc_() { return CacheService.getScriptCache(); }
function qk_(pin) { return "qz:" + pin + ":" + Array.prototype.slice.call(arguments, 1).join(":"); }
function qget_(k) { const v = qc_().get(k); return v ? JSON.parse(v) : null; }
function qset_(k, v) { qc_().put(k, JSON.stringify(v), QZ_TTL); }
function qmany_(keys) {
  const out = {};
  for (let i = 0; i < keys.length; i += 100) {
    const part = qc_().getAll(keys.slice(i, i + 100));
    Object.keys(part).forEach(function (k) { out[k] = JSON.parse(part[k]); });
  }
  return out;
}
function qpub_(q) { return { type: q.type, text: q.text, options: q.options, time: q.time }; }
function qranking_(players, totals) {
  const rows = players.map(function (p) { return { pid: p.pid, name: p.name, score: totals[p.pid] || 0 }; })
    .sort(function (a, b) { return b.score - a.score; });
  const ranks = {}; let last = null, r = 0;
  rows.forEach(function (row, i) { if (row.score !== last) { r = i + 1; last = row.score; } ranks[row.pid] = r; row.rank = r; });
  return { rows: rows, ranks: ranks };
}

function quizCreate_(quiz) {
  if (!quiz || !quiz.questions || !quiz.questions.length) throw new Error("문항이 없습니다.");
  if (JSON.stringify(quiz).length > 90000) throw new Error("퀴즈가 너무 깁니다. 문항 수를 줄여 주세요.");
  let pin; do { pin = String(100000 + Math.floor(Math.random() * 900000)); } while (qget_(qk_(pin, "state")));
  qset_(qk_(pin, "quiz"), quiz); qset_(qk_(pin, "players"), []); qset_(qk_(pin, "totals"), {});
  qset_(qk_(pin, "state"), { pin: pin, title: quiz.title, total: quiz.questions.length, status: "lobby", qIndex: -1 });
  return { pin: pin };
}

function quizJoin_(pin, name, sid) {
  return withLock_(function () {
    const st = qget_(qk_(pin, "state"));
    if (!st) throw new Error("PIN에 해당하는 퀴즈가 없습니다. 번호를 확인해 주세요.");
    if (st.status === "ended") throw new Error("이미 끝난 퀴즈입니다.");
    name = String(name || "").trim().slice(0, 20);
    if (!name) throw new Error("이름(닉네임)을 입력해 주세요.");
    const players = qget_(qk_(pin, "players")) || [];
    if (players.length >= 200) throw new Error("참여 인원이 가득 찼습니다.");
    if (sid) { const ex = players.find(function (p) { return p.sid && p.sid === String(sid); }); if (ex) return { pid: ex.pid, name: ex.name }; }
    let n = name, i = 2; while (players.some(function (p) { return p.name === n; })) n = name + " (" + (i++) + ")";
    const pid = Utilities.getUuid().replace(/-/g, "").slice(0, 10);
    players.push({ pid: pid, name: n, sid: sid ? String(sid) : "" });
    qset_(qk_(pin, "players"), players);
    return { pid: pid, name: n };
  });
}

function quizState_(pin, pid) {
  const got = qmany_([qk_(pin, "state"), qk_(pin, "players")]);
  const st = got[qk_(pin, "state")];
  if (!st) throw new Error("퀴즈가 종료되었거나 없습니다.");
  const ranks = st.ranks; delete st.ranks;
  const out = { state: st, now: Date.now(), playerCount: (got[qk_(pin, "players")] || []).length };
  if (pid) {
    const m = qmany_([qk_(pin, "totals"), qk_(pin, "a", st.qIndex, pid)]), rec = m[qk_(pin, "a", st.qIndex, pid)];
    out.me = { total: (m[qk_(pin, "totals")] || {})[pid] || 0, rank: ranks ? ranks[pid] || null : null,
      answer: rec ? (st.status === "question" ? { choice: rec.choice } : rec) : null };
  }
  return out;
}

function quizAnswer_(pin, pid, q, choice) {
  const st = qget_(qk_(pin, "state")), now = Date.now();
  if (!st || st.status !== "question" || st.qIndex !== q) throw new Error("지금은 답을 낼 수 없어요.");
  if (now < st.startsAt) throw new Error("아직 시작 전이에요.");
  if (now > st.endsAt + 1500) throw new Error("시간이 지났어요.");
  if (qget_(qk_(pin, "a", q, pid))) throw new Error("이미 답을 냈어요.");
  const qq = qget_(qk_(pin, "quiz")).questions[q];
  const ms = Math.max(0, now - st.startsAt), correct = choice === Number(qq.answer);
  const points = correct ? Math.round(1000 * (1 - Math.min(1, ms / (qq.time * 1000)) / 2)) : 0;
  qset_(qk_(pin, "a", q, pid), { choice: choice, ms: ms, correct: correct, points: points });
  return {};
}

function quizHost_(pin, cmd) {
  const st = qget_(qk_(pin, "state"));
  if (!st) throw new Error("퀴즈를 찾을 수 없습니다.");
  const quiz = qget_(qk_(pin, "quiz")), players = qget_(qk_(pin, "players")) || [], now = Date.now();
  let revealAns = null;
  const totals = qget_(qk_(pin, "totals")) || {};   // 점수 합계는 정답 공개 때 교수자 요청으로 한 번만 계산
  if (cmd === "start" || cmd === "next") {
    const q = cmd === "start" ? 0 : st.qIndex + 1;
    if (q >= quiz.questions.length) cmd = "end";
    else {
      const qq = quiz.questions[q], startsAt = now + 3000;
      st.status = "question"; st.qIndex = q; st.question = qpub_(qq); st.startsAt = startsAt; st.endsAt = startsAt + qq.time * 1000; st.reveal = null;
      qset_(qk_(pin, "state"), st);
    }
  }
  if (cmd === "reveal" && st.status === "question") {
    const qq = quiz.questions[st.qIndex];
    const ans = revealAns = qmany_(players.map(function (p) { return qk_(pin, "a", st.qIndex, p.pid); }));
    const counts = qq.options.map(function () { return 0; }); let answered = 0;
    players.forEach(function (p) {
      const a = ans[qk_(pin, "a", st.qIndex, p.pid)]; if (!a) return;
      counts[a.choice] = (counts[a.choice] || 0) + 1; answered++;
      if (st.scoredQ !== st.qIndex) totals[p.pid] = (totals[p.pid] || 0) + a.points;
    });
    st.scoredQ = st.qIndex; qset_(qk_(pin, "totals"), totals);
    const rk = qranking_(players, totals);
    st.status = "reveal"; st.reveal = { answer: qq.answer, counts: counts, answered: answered, explain: qq.explain || "" };
    st.ranks = rk.ranks; st.leaderboard = rk.rows.slice(0, 5);
    qset_(qk_(pin, "state"), st);
  }
  if (cmd === "leaderboard") { st.status = "leaderboard"; qset_(qk_(pin, "state"), st); }
  if (cmd === "end") {
    const rk2 = qranking_(players, totals);
    st.status = "ended"; st.ranks = rk2.ranks; st.leaderboard = rk2.rows.slice(0, 10);
    qset_(qk_(pin, "state"), st);
  }
  const q2 = st.qIndex, keys = [];
  if (q2 >= 0) players.forEach(function (p) { keys.push(qk_(pin, "a", q2, p.pid)); });
  const m = revealAns || qmany_(keys), answers = {}, tot = {};
  players.forEach(function (p) { answers[p.pid] = q2 >= 0 ? (m[qk_(pin, "a", q2, p.pid)] || null) : null; tot[p.pid] = totals[p.pid] || 0; });
  return { state: st, now: now, players: players, answers: answers, totals: tot };
}

function quizSave_(rows) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName("퀴즈결과");
  if (!sh) { sh = ss.insertSheet("퀴즈결과"); sh.appendRow(HEADERS["퀴즈결과"]); }
  if (rows.length) sh.getRange(sh.getLastRow() + 1, 1, rows.length, rows[0].length).setValues(rows.map(function (r) { return r.map(String); }));
  return { count: rows.length };
}
